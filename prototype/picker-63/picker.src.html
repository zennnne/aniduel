<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>PROTOTYPE · Picker (#63)</title>
<!-- PROTOTYPE, throwaway (#63). Round 1 chose the cover wall (rounds/round1-overall-shape.src.html).
     Round 2 chose K1 + F1 (a rail that can be closed) + S1 (rounds/round2-component-groups.src.html).
     Round 3 chose C2 + R4 + D1 (rounds/round3-single-components.src.html) and asked for genre and tag filters and Pick all.
     Round 4 chose G5 (nothing listed in the rail) + P2 + M1 (rounds/round4-genres-pickall-question.src.html).
     Round 5 chose H2 + E2 with E1's face (rounds/round5-phone-nomatch.src.html).
     This file is the final design: every choice applied, nothing left to switch but the states. Built by build.mjs. -->
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
/* ---- theme, copied from src/ui/theme.css ---- */
:root{--bg:#edf1f5;--fg:#fafafa;--fg2:#e5ebf1;--tx:#5c728a;--tx-strong:#2b2d42;--blue:#3db4f2;--nav:#2b2d42;--navtx:#bcbedc;--danger:#e05555;--warn:#f2b13d;--on-accent:#fff;--shadow:#0002;--good:#3fae5a;--why:#b7791f;color-scheme:light}
:root.dark{--bg:#0b1622;--fg:#151f2e;--fg2:#1f2a3c;--tx:#9fadbd;--tx-strong:#edf1f5;--nav:#0b1622;--navtx:#9fadbd;--why:#f2b13d;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Overpass,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px;background:#11131c;color:var(--tx)}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font:inherit;color:inherit}
.small{font-size:12px}.strong{color:var(--tx-strong)}.fine{opacity:.7}.grow{flex:1;min-width:0}
.link{color:var(--blue);text-decoration:underline}
.go{background:var(--blue);color:var(--on-accent);font-weight:800;padding:13px 22px;border-radius:12px;display:inline-flex;gap:10px;align-items:center;justify-content:center;white-space:nowrap}
.go:disabled{opacity:.4;cursor:not-allowed}
.cv{object-fit:cover;display:block;background:var(--c,var(--blue));flex-shrink:0}
.ph{background:linear-gradient(160deg,var(--c,var(--blue)),var(--nav))}
.chips{display:flex;flex-wrap:wrap;gap:6px;scrollbar-width:none}
.chip{padding:6px 11px;border-radius:999px;background:var(--fg2);font-size:13px;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.chip.on{background:var(--blue);color:var(--on-accent);font-weight:700}
.chip .cnt{opacity:.7;font-size:11px}
.lsel{padding:6px 8px;border-radius:8px;border:none;background:var(--fg2);color:var(--tx-strong);font-weight:800}
.mini-b{font-size:12px;padding:6px 10px;border-radius:8px;background:var(--fg2);color:var(--tx-strong);display:inline-flex;align-items:center;gap:4px;font-weight:700;white-space:nowrap}
.mini-b:hover:not(:disabled){background:var(--blue);color:var(--on-accent)}
.mini-b:disabled{opacity:.4;cursor:not-allowed}
.mini-b.on{background:var(--blue);color:var(--on-accent)}

/* ---- stage: the mocked app's viewport ---- */
#stage{height:100vh;width:100%;margin:0 auto;background:var(--bg);position:relative;overflow:hidden;container:app/inline-size}
body.phone #stage{width:390px;height:min(800px,calc(100vh - 40px));margin-top:20px;border-radius:26px;box-shadow:0 0 0 8px #000,0 0 0 10px #444}
#app{height:100%;position:relative}
.scr{height:100%;display:flex;flex-direction:column;min-height:0;color:var(--tx)}
.h1{font-size:26px;font-weight:900;color:var(--tx-strong);line-height:1.1;white-space:nowrap}
.back{font-weight:700;color:var(--tx);padding:6px 10px;border-radius:8px;background:var(--fg2);white-space:nowrap}
.srch{display:flex;align-items:center;gap:6px;background:var(--fg);border-radius:10px;padding:0 10px;min-width:120px;flex:1;max-width:340px;box-shadow:inset 0 0 0 1px var(--fg2)}
.srch input{border:none;outline:none;background:none;padding:8px 0;width:100%;color:var(--tx-strong)}
.stt{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.stt i{width:7px;height:7px;border-radius:50%;display:inline-block}
.rep{font-size:11px;font-weight:800;color:#8a5a00;background:color-mix(in srgb,var(--warn) 30%,var(--fg));border-radius:6px;padding:1px 6px;white-space:nowrap}
.dark .rep{color:var(--warn)}
.why{color:var(--why);font-weight:700}
.nomatch{grid-column:1/-1;margin:auto;padding:40px 20px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.nomatch .k{font-size:26px;color:var(--tx-strong)}
.nomatch b{color:var(--tx-strong);font-size:16px}
.box{width:20px;height:20px;border-radius:6px;box-shadow:inset 0 0 0 2px var(--tx);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;color:transparent;font-weight:900;font-size:13px;opacity:.6}
.box.on{background:var(--blue);box-shadow:none;color:#fff;opacity:1}
.toast{position:absolute;left:50%;top:16px;transform:translateX(-50%);background:var(--nav);color:#fff;padding:10px 16px;border-radius:10px;z-index:40;box-shadow:0 6px 24px #0006;font-size:13px;max-width:90%}
.lab{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}

/* ---- skeleton ---- */
.body{flex:1;min-height:0;display:flex}
.col{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}
.hrow{display:flex;align-items:center;gap:12px;padding:16px 20px 8px;flex-wrap:wrap}
.ww{flex:1;min-height:0;position:relative;display:flex}
.wall{flex:1;overflow:auto;min-height:0;padding:12px 20px 24px;display:grid;gap:14px 12px;align-content:start}
.wall{padding-bottom:120px!important}
.sec{grid-column:1/-1;display:flex;align-items:center;gap:8px;padding:6px 2px;font-weight:800;color:var(--tx-strong);font-size:15px;text-align:left;border-bottom:2px solid var(--fg2);position:sticky;top:-12px;background:var(--bg);z-index:3}
.sec.off{opacity:.55}
.sec i{width:9px;height:9px;border-radius:50%}
.sec .cnt{font-weight:400;font-size:12px;color:var(--tx)}
.sec .tg{margin-left:auto;font-size:12px;color:var(--blue)}

/* ================= settled: the title card (round 3, C2) ================= */
.wall{grid-template-columns:repeat(auto-fill,minmax(118px,1fr))}
.cd{text-align:left;display:flex;flex-direction:column;gap:5px;min-width:0;position:relative}
.cd .im{position:relative;border-radius:8px;overflow:hidden;aspect-ratio:2/3;box-shadow:0 4px 14px var(--shadow);display:block;flex-shrink:0;width:100%;transition:transform .1s}
.cd .im .cv{width:100%;height:100%}
.cd .tt{color:var(--tx-strong);font-weight:700;font-size:12px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cd .mt{font-size:11px}
.bs{position:absolute;left:6px;top:6px;background:#000b;color:#fff;border-radius:6px;padding:1px 7px;font-weight:900;font-size:14px}
.bs.none{font-size:10px;font-weight:700;background:#000a;border:1px dashed #fff9}
.tk{position:absolute;right:6px;top:6px;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;color:transparent}
.cd.on .tk{background:var(--blue);color:#fff;box-shadow:0 0 0 2px #fff}
.cd.on .im{outline:4px solid var(--blue);outline-offset:2px;transform:scale(.93)}
.cd.on .bs{background:var(--blue);border:none}.cd.on .bs.re{background:var(--warn);color:#2b2d42}

/* ================= settled: the rail (round 2, F1) and its closed line (round 3, R4) ================= */
.rail{width:240px;flex-shrink:0;background:var(--fg);padding:16px;display:flex;flex-direction:column;gap:12px;overflow:auto;min-height:0;position:relative;z-index:8}
.rail .lab{margin-bottom:-6px}
.rail .srch{flex:none;background:var(--fg2);box-shadow:none}
.rail .rh{display:flex;align-items:center;gap:8px}
.rtog{width:28px;height:28px;border-radius:7px;background:var(--fg2);color:var(--tx-strong);font-weight:900;flex-shrink:0}
.rtog:hover{background:var(--blue);color:#fff}
.rail .rtog{margin-left:auto}
.ck{display:flex;align-items:center;gap:8px;padding:5px 4px;border-radius:8px;text-align:left;color:var(--tx-strong);width:100%}
.ck .cnt{margin-left:auto;font-size:12px;color:var(--tx)}
.ck:disabled{opacity:.4}
.rail .lsel,.rail>.mini-b{width:100%;justify-content:center}
.fbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 20px 4px}
.tok{display:inline-flex;align-items:center;gap:6px;background:color-mix(in srgb,var(--blue) 18%,var(--fg));color:var(--tx-strong);border-radius:999px;padding:4px 6px 4px 10px;font-size:12px;font-weight:700}
.tok b{opacity:.6}
.tok.g{background:color-mix(in srgb,#8f67d8 22%,var(--fg))}.tok.t{background:color-mix(in srgb,var(--good) 22%,var(--fg))}

/* ================= settled: the dock (round 3, D1) ================= */
.dock{position:absolute;left:50%;transform:translateX(-50%);bottom:18px;background:var(--nav);color:#fff;border-radius:18px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:16px;box-shadow:0 12px 40px #0008;z-index:5;max-width:calc(100% - 40px);width:max-content}
.dark .dock,.dark .bulk4{box-shadow:0 0 0 1px #ffffff33,0 12px 40px #000}
.stack{display:flex}
.stack .cv{width:26px;height:36px;border-radius:4px;margin-left:-10px;box-shadow:0 0 0 2px var(--nav)}
.stack .cv:first-child{margin-left:0}
.dock .tx{display:flex;flex-direction:column;gap:1px;font-size:12px;color:#fffc;min-width:0;text-align:left}
.dock .tx b{font-size:15px;color:#fff}
.dock .why{color:var(--warn)}

/* ================= G · genre and tag filters ================= */
.gbtn{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;border-radius:8px;background:var(--fg2);color:var(--tx-strong);font-weight:800;text-align:left}
.gbtn .v{margin-left:auto;font-weight:400;font-size:12px;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:110px}
.gbtn.on{box-shadow:inset 0 0 0 2px var(--blue)}
.fly{position:absolute;left:246px;top:150px;z-index:30;width:300px;max-height:min(460px,calc(100% - 170px));background:var(--fg);border-radius:14px;box-shadow:0 12px 40px #0007;padding:12px;display:flex;flex-direction:column;gap:8px}
.fly .srch,.acc .srch,.gm .srch{flex:none;max-width:none;background:var(--fg2);box-shadow:none}
.clist{overflow:auto;min-height:0;display:flex;flex-direction:column}
.clist .ck{padding:4px}
.gchips{display:flex;flex-wrap:wrap;gap:4px}
.gc{font-size:11px;padding:3px 8px;border-radius:999px;background:var(--fg2);color:var(--tx-strong);white-space:nowrap}
.gc .cnt{opacity:.6;font-size:10px;margin-left:3px}
.gc.on{background:#8f67d8;color:#fff;font-weight:700}.gc.t.on{background:var(--good)}
.gc:disabled{opacity:.35}
.sug{display:flex;flex-direction:column;background:var(--fg2);border-radius:8px;overflow:hidden;margin-top:-6px}
.sug button{display:flex;gap:8px;padding:6px 10px;text-align:left;color:var(--tx-strong);font-size:13px}
.sug button:hover{background:var(--blue);color:#fff}
.sug .k{font-size:10px;font-weight:800;text-transform:uppercase;opacity:.6;width:38px;flex-shrink:0;padding-top:2px}
.sug .cnt{margin-left:auto;opacity:.6;font-size:12px}
.acc{display:flex;flex-direction:column;gap:6px}
.acc .clist{max-height:210px;background:var(--fg2);border-radius:8px;padding:4px}
.gm{width:min(760px,94cqw)!important;max-height:86%;overflow:auto}
.gm .gc{font-size:13px;padding:5px 11px}

/* ================= P · picking many at once ================= */
.whead{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 20px 2px}
.menu{position:absolute;z-index:30;top:calc(100% + 4px);left:0;min-width:230px;background:var(--fg);border-radius:12px;box-shadow:0 12px 40px #0007;padding:6px;display:flex;flex-direction:column}
.menu button{padding:8px 10px;border-radius:8px;text-align:left;color:var(--tx-strong);display:flex;gap:8px}
.menu button:hover:not(:disabled){background:var(--fg2)}
.menu button:disabled{opacity:.4}
.menu hr{border:none;border-top:1px solid var(--fg2);margin:4px 0}
.menu .cnt{margin-left:auto;color:var(--tx)}
.mw{position:relative;display:inline-flex}
.rail .mw,.rail .mw>.mini-b{width:100%;justify-content:center}
.bulk4{position:absolute;left:18px;bottom:18px;z-index:5;background:var(--fg);border-radius:16px;padding:8px;display:flex;flex-direction:column;gap:6px;box-shadow:0 12px 40px #0006}
.bulk4 .mini-b{justify-content:flex-start;padding:8px 12px}
.bulk4 .ln{display:flex;gap:10px;padding:0 6px;font-size:12px}
.tri{display:inline-flex;align-items:center;background:var(--fg2);border-radius:8px}
.tri>button{padding:6px 8px;display:flex;align-items:center;gap:6px;color:var(--tx-strong);font-weight:700;font-size:12px}
.tri .box{opacity:1}.tri .box.mid{background:var(--blue);box-shadow:none;color:#fff}
.tri .car{border-left:1px solid var(--fg);padding:6px 7px}

/* ================= M · the question before the Picker ================= */
.dscrim{position:absolute;inset:0;background:#0009;z-index:60;display:flex;align-items:center;justify-content:center}
.dlg{background:var(--fg);border-radius:16px;padding:22px;width:min(460px,92cqw);display:flex;flex-direction:column;gap:12px;color:var(--tx);box-shadow:0 20px 60px #000a}
.dlg .h2{font-size:20px;font-weight:800;color:var(--tx-strong)}
.dlg p{line-height:1.5}
.dlg .btns{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:4px}
.dlg .sec{font-weight:800;color:var(--tx-strong);padding:13px 18px;border-radius:12px;background:var(--fg2)}
.ucov{display:flex;gap:10px;overflow:auto;padding:2px}
.ucov .u{width:84px;flex-shrink:0;display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--tx-strong);text-align:left;position:relative}
.ucov .u .cv{width:84px;height:118px;border-radius:6px}
.ucov .u span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.2}
.ucov .u .box{position:absolute;left:5px;top:5px;background:var(--fg);opacity:1}.ucov .u .box.on{background:var(--blue)}
.ucov .u.off .cv{filter:grayscale(1) brightness(.6)}
.full{position:absolute;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
.full .fan{display:flex}
.full .fan .cv{width:130px;height:184px;border-radius:10px;box-shadow:0 10px 30px #0006;margin:0 -14px;transform:rotate(var(--r)) translateY(var(--y))}
.full .big{font-size:30px;font-weight:900;color:var(--tx-strong);line-height:1.1}
.full p{max-width:440px;line-height:1.5}
.ban{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:12px;background:color-mix(in srgb,var(--blue) 16%,var(--fg));border:1px solid var(--blue);border-radius:12px;padding:10px 12px;color:var(--tx-strong)}
.ban .stack .cv{box-shadow:0 0 0 2px var(--fg)}
.sheetd{position:absolute;left:0;right:0;bottom:0;z-index:61;background:var(--fg);border-radius:20px 20px 0 0;padding:14px 22px 22px;display:flex;flex-direction:column;gap:12px;box-shadow:0 -20px 60px #000a;align-items:center;text-align:center}
.sheetd .grab{width:44px;height:5px;border-radius:3px;background:var(--fg2)}
.sheetd .btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

@container app (max-width:720px){
  .body{flex-direction:column}
  .h1{font-size:21px}
  .fbar,.whead{padding:8px 12px 4px;gap:6px}
  .rail{width:auto;padding:10px 12px;gap:8px;overflow:auto;max-height:62%}
  .rail .lab{margin-bottom:-4px}
  .rail .sts{display:flex;flex-wrap:wrap;gap:4px}.rail .sts .ck{width:auto;white-space:nowrap;background:var(--fg2);padding:4px 8px}
  .fly{left:8px;right:8px;width:auto;top:auto;bottom:8px;max-height:70%}
  .wall{padding:10px 12px 130px;gap:10px 8px;grid-template-columns:repeat(3,1fr)}
  .dock{left:8px;right:8px;transform:none;max-width:none;width:auto;bottom:8px;gap:10px;padding-left:12px}
  .dock .stack{display:none}.dock .tx{flex:1}.dock .go{padding:10px 14px}
  .bulk4{left:8px;bottom:84px;flex-direction:row;flex-wrap:wrap;right:8px}
  .full .fan .cv{width:88px;height:124px}.full .big{font-size:24px}
}

/* ================= settled in round 4: G5 (rounded, scrolls inside), P2, M1 ================= */
.gm{padding:0!important;overflow:hidden!important;gap:0!important;max-height:86%}
.gm .scy{overflow:auto;min-height:0;padding:22px 22px 14px;display:flex;flex-direction:column;gap:12px}
.gm .btns{padding:12px 22px;border-top:1px solid var(--fg2);margin:0}
.whead .cntl{white-space:nowrap}

/* ================= H · the phone ================= */
.ptop{display:flex;align-items:center;gap:8px;padding:10px 12px 6px}
.ptop .srch{max-width:none}
.ptop .h1{font-size:20px}
.fb{position:relative;display:inline-flex;align-items:center;gap:6px;padding:8px 11px;border-radius:9px;background:var(--fg2);color:var(--tx-strong);font-weight:800;white-space:nowrap;flex-shrink:0}
.fb i{font-style:normal;background:var(--blue);color:#fff;border-radius:999px;font-size:11px;padding:0 6px}
.psum{padding:0 12px 4px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scrim{position:absolute;inset:0;background:#0007;z-index:20}
.psheet{position:absolute;left:0;right:0;bottom:0;z-index:21;background:var(--fg);border-radius:20px 20px 0 0;padding:10px 16px 16px;display:flex;flex-direction:column;gap:10px;max-height:82%;overflow:auto;box-shadow:0 -20px 60px #0008}
.psheet .grab{width:44px;height:5px;border-radius:3px;background:var(--fg2);align-self:center;flex-shrink:0}
.psheet .lab,.ppage .lab{margin-bottom:-4px}
.psheet .sts,.ppage .sts{display:flex;flex-wrap:wrap;gap:6px}
.psheet .sts .ck,.ppage .sts .ck{width:auto;background:var(--fg2);padding:6px 10px;white-space:nowrap}
.psheet .lsel,.ppage .lsel{width:100%;padding:10px}
.psheet .go,.ppage .go{width:100%;flex-shrink:0}
.ppage{position:absolute;inset:0;z-index:21;background:var(--bg);display:flex;flex-direction:column}
.ppage .pb{flex:1;overflow:auto;padding:6px 16px 16px;display:flex;flex-direction:column;gap:12px}
.ppage .pb .srch{flex:none;max-width:none}
.ppage .pf{padding:10px 16px 14px;background:var(--fg);box-shadow:0 -6px 24px var(--shadow)}
.crow{display:flex;gap:6px;overflow-x:auto;padding:2px 12px 6px;scrollbar-width:none;align-items:center}
.crow>*{flex-shrink:0}
.crow .chip{font-size:12px;padding:6px 10px}
.crow .lsel{font-size:12px;border-radius:999px;padding:6px 8px}
.crow .sep{width:1px;height:20px;background:var(--fg2)}
.dfil{width:44px;height:44px;border-radius:12px;background:#ffffff1f;color:#fff;font-size:18px;position:relative;flex-shrink:0;margin-left:-6px}
.dfil i{position:absolute;right:-4px;top:-4px;font-style:normal;background:var(--blue);color:#fff;border-radius:999px;font-size:10px;font-weight:900;padding:0 5px}
.phone .whead{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.phone .whead>*{flex-shrink:0}
.phone .rail{max-height:64%}

/* ================= E · nothing matches ================= */
.nomatch .mini-b{font-size:13px;padding:9px 14px}
.nomatch .mini-b b{color:var(--blue);margin-left:6px}
.nomatch .mini-b:hover b{color:#fff}
.nomatch.e3{padding:18px 4px;margin:0;align-items:flex-start;text-align:left}
.out{grid-column:1/-1;display:flex;flex-direction:column;gap:2px;padding:6px 2px 4px;color:var(--tx-strong)}
.out b{font-size:15px}
.e5 .face{width:120px;height:120px;border-radius:50%;background:var(--fg);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;color:var(--tx-strong);box-shadow:0 10px 40px var(--shadow);margin-bottom:8px}
.e5 .row2{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.e5 .go{padding:10px 18px}

/* ================= prototype picker (not part of any design) ================= */
#pp{position:fixed;right:16px;bottom:96px;z-index:999;background:#1b1030;color:#fff;border:2px solid #ff4fd8;border-radius:14px;box-shadow:0 10px 40px #000a;font:12px/1.3 ui-monospace,Consolas,monospace;width:310px;user-select:none}
#pp .grip{cursor:move;padding:6px 10px;color:#ff9be8;display:flex;justify-content:space-between;border-bottom:1px solid #ff4fd855}
#pp .ax{display:grid;grid-template-columns:28px 1fr 28px;align-items:center;padding:5px 8px;gap:6px;text-align:center;cursor:pointer;border-left:4px solid transparent}
#pp .ax.on{background:#ff4fd822;border-left-color:#ff4fd8}
#pp .ax button{background:#ffffff26;color:#fff;border-radius:7px;height:26px;font-weight:900;font-size:14px}
#pp .ax.on button{background:#ff4fd8;color:#1b1030}
#pp .ax small{display:block;color:#ff9be8;font-size:10px;text-transform:uppercase;letter-spacing:.08em}
#pp .hint{padding:2px 10px 6px;color:#ffffff88;font-size:10px}
#pp .sts{display:flex;flex-wrap:wrap;gap:4px;padding:4px 8px 8px;border-top:1px solid #ff4fd855}
#pp .sts button{background:#ffffff1a;border-radius:6px;padding:4px 7px;color:#fff}
#pp .sts button.on{background:#ff4fd8;color:#1b1030;font-weight:900}
#pp .sts hr{flex-basis:100%;border:none;height:0}
</style>
</head>
<body>
<div id="stage"><div id="app"></div></div>
<div id="pp"></div>
<script>
const DATA = /*DATA*/null;
const BASE = DATA.base, ALL = DATA.base.concat(DATA.extra);
const ST = { COMPLETED: ['Completed', '#3fae5a'], REPEATING: ['Repeating', '#3db4f2'], CURRENT: ['Watching', '#f2a03d'], PAUSED: ['Paused', '#8f67d8'], DROPPED: ['Dropped', '#e05555'] };
const AXES = {
  h: ['Phone: filters', [['H2', 'Filters button, bottom sheet']]],
  e: ['Nothing matches', [['E2', 'Face + which filter to drop']]],
};
const STATES = [['empty', 'Nothing picked'], ['catchup', 'From Catch-up'], ['mix', 'Mix'], ['few', 'Too few Anchors'], ['long', '1000+ titles'], ['nomatch', 'No match'], ['dialog', 'Unsettled question']];
const SORTS = [['default', 'No score first, then newest'], ['title', 'Title'], ['score', 'Score'], ['year', 'Release year']];
const UNS = ['Hyouka', 'Made in Abyss', 'Tokyo Ghoul'].map((n) => BASE.find((t) => t.title === n));
const S = { h: 'H2', e: 'E2', ax: 'h', open: true, preset: 'mix', phone: false, dark: false, picked: new Set(), statuses: new Set(), genres: new Set(), tags: new Set(), tq: '', pop: '', dlg: false, uns: new Set(),
  year: '', search: '', sort: 'default', only: false, long: false, toast: '' };

function preset(p) {
  Object.assign(S, { preset: p, long: p === 'long', search: p === 'nomatch' ? 'gin' : '', year: '', sort: 'default', only: false, toast: '', tq: '', pop: '', dlg: p === 'dialog' });
  S.statuses = new Set(['COMPLETED', 'REPEATING']); S.genres = new Set(); S.tags = new Set(); S.uns = new Set(UNS.map((t) => t.id));
  const un = BASE.filter((t) => !t.score), sc = BASE.filter((t) => t.score);
  const ts = p === 'empty' || p === 'dialog' ? [] : p === 'catchup' ? un.filter((t) => t.status === 'COMPLETED' || t.status === 'REPEATING')
    : p === 'few' ? un.slice(0, 3).concat(sc.slice(0, 10)) : un.slice(0, 5).concat([sc[2], sc[9], sc[19]]);
  S.picked = new Set(ts.map((t) => t.id));
}

function view() {
  const list = S.long ? ALL : BASE, P = S.picked;
  const okF = (t) => S.statuses.has(t.status) && (!S.year || String(t.year) === S.year) && [...S.genres].every((g) => t.g.includes(g)) && [...S.tags].every((x) => t.tg.includes(x));
  const q = S.search.trim().toLowerCase();
  const byT = (a, b) => a.title.localeCompare(b.title);
  const cmp = { default: (a, b) => !!a.score - !!b.score || b.done - a.done || byT(a, b), title: byT, score: (a, b) => b.score - a.score || byT(a, b), year: (a, b) => (b.year || 0) - (a.year || 0) || byT(a, b) };
  const pass = list.filter(okF);
  const rows = pass.filter((t) => (!q || t.title.toLowerCase().includes(q)) && (!S.only || P.has(t.id))).sort(cmp[S.sort]);
  const picked = list.filter((t) => P.has(t.id));
  const anchors = list.filter((t) => t.score && !P.has(t.id));
  const scores = new Set(anchors.map((t) => t.score));
  const cnt = {}, gc = {}, tc = {};
  list.forEach((t) => { cnt[t.status] = (cnt[t.status] || 0) + 1; });
  pass.forEach((t) => { t.g.forEach((g) => (gc[g] = (gc[g] || 0) + 1)); t.tg.forEach((x) => (tc[x] = (tc[x] || 0) + 1)); });
  const reason = !picked.length ? 'Nothing picked yet.' : anchors.length < 20 ? `Only ${anchors.length} Anchors left, 20 needed. Untick some titles that have a score.` : scores.size < 3 ? `Anchors left on only ${scores.size} scores, 3 needed. Untick some titles that have a score.` : '';
  const tq = S.tq.trim().toLowerCase();
  return { list, rows, picked, anchors, scores: scores.size, cnt, gc, tc, reason, blocked: !!reason && picked.length > 0,
    genres: [...new Set(list.flatMap((t) => t.g))].sort(), nTags: new Set(list.flatMap((t) => t.tg)).size,
    tagsHit: [...new Set(list.flatMap((t) => t.tg))].filter((x) => (tc[x] || S.tags.has(x)) && (!tq || x.toLowerCase().includes(tq))).sort((a, b) => (tc[b] || 0) - (tc[a] || 0) || a.localeCompare(b)),
    pickN: rows.filter((t) => !P.has(t.id)).length,
    rescored: picked.filter((t) => t.score).length, addN: pass.filter((t) => !t.score && !P.has(t.id)).length,
    duels: picked.length * (Math.ceil(Math.log2(scores.size + 1)) + 2), years: [...new Set(list.map((t) => t.year).filter(Boolean))].sort((a, b) => b - a) };
}

/* ---- shared fragments ---- */
const h = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const cv = (t) => t.cover ? `<img class="cv" loading="lazy" src="${t.cover}" style="--c:${t.color || '#3db4f2'}" alt="">` : `<span class="cv ph" style="--c:${t.color || '#3db4f2'}"></span>`;
const on = (t) => S.picked.has(t.id) ? 'on' : '';
const repl = (t) => S.picked.has(t.id) && t.score;
const tick = (t) => `data-act="tick" data-id="${t.id}"`;
const fSearch = () => `<label class="srch"><span>⌕</span><input data-in="search" placeholder="Search titles" value="${h(S.search)}"></label>`;
const fChecks = (v) => `<div class="sts">${Object.keys(ST).map((k) => `<button class="ck" data-act="status" data-id="${k}"><span class="box ${S.statuses.has(k) ? 'on' : ''}">✓</span>${ST[k][0]}<span class="cnt">${v.cnt[k] || 0}</span></button>`).join('')}</div>`;
const fYear = (v) => `<select class="lsel" data-in="year"><option value="">All years</option>${v.years.map((y) => `<option ${S.year == y ? 'selected' : ''}>${y}</option>`).join('')}</select>`;
const fSort = () => `<select class="lsel" data-in="sort">${SORTS.map(([k, l]) => `<option value="${k}" ${S.sort === k ? 'selected' : ''}>Sort: ${l}</option>`).join('')}</select>`;
const fPick = (v) => `<button class="mini-b" data-act="pickall" ${v.pickN ? '' : 'disabled'}>✓ Pick all ${v.rows.length} shown</button>`;
const fAdd = (v) => `<button class="mini-b" data-act="addall" ${v.addN ? '' : 'disabled'}>＋ Add ${v.addN} without a score</button>`;
const fClear = (v) => `<button class="mini-b" data-act="clear" ${v.picked.length ? '' : 'disabled'}>Clear picks</button>`;
const fOnly = (v) => `<button class="mini-b ${S.only ? 'on' : ''}" data-act="only">Picked only (${v.picked.length})</button>`;
const fBack = () => `<button class="back" data-act="back">← Start</button>`;
const fGo = (v) => `<button class="go" data-act="go" ${v.reason ? 'disabled' : ''}>Start Duels</button>`;
const stack = (ts) => ts.length ? `<div class="stack">${ts.slice(0, 6).map(cv).join('')}</div>` : '';
const card = (t) => `<button class="cd ${on(t)}" ${tick(t)}><span class="im">${cv(t)}<span class="tk">✓</span><span class="bs ${t.score ? '' : 'none'} ${repl(t) ? 're' : ''}">${t.score ? (repl(t) ? `${t.score} → ?` : t.score) : 'no score'}</span></span>
  <span class="tt">${h(t.title)}</span><span class="mt">${t.year || '—'} · ${ST[t.status][0]}</span></button>`;
const dock = (v, pre) => `<div class="dock">${pre || ''}${stack(v.picked)}<div class="tx"><b>${v.picked.length} picked${v.rescored ? ` · ${v.rescored} replace a score` : ''}</b><span class="${v.blocked ? 'why' : ''}">${v.reason || `${v.anchors.length} Anchors left on ${v.scores} scores · ≈ ${v.duels} Duels`}</span></div>${fGo(v)}</div>`;
const tokens = () => [...S.statuses].map((k) => `<span class="tok">${ST[k][0]}<button data-act="status" data-id="${k}"><b>✕</b></button></span>`).join('') + (S.year ? `<span class="tok">${S.year}<button data-act="year" data-id=""><b>✕</b></button></span>` : '') + (S.genres.size + S.tags.size ? `<span class="tok g"><button data-act="pop" data-id="more">Genres and tags · ${S.genres.size + S.tags.size}</button><button data-act="gclear"><b>✕</b></button></span>` : '');
const gtoks = () => [...S.genres].map((g) => `<span class="tok g">${h(g)}<button data-act="genre" data-id="${h(g)}"><b>✕</b></button></span>`).join('') + [...S.tags].map((x) => `<span class="tok t">${h(x)}<button data-act="tag" data-id="${h(x)}"><b>✕</b></button></span>`).join('');

/* ---- E · nothing matches ---- */
const ALLST = Object.keys(ST);
function noMatch(v) {
  if (v.rows.length) return '';
  const q = S.search.trim().toLowerCase(), hit = (t) => !q || t.title.toLowerCase().includes(q);
  const st = (t) => S.statuses.has(t.status), yr = (t) => !S.year || String(t.year) === S.year, gt = (t) => [...S.genres].every((g) => t.g.includes(g)) && [...S.tags].every((x) => t.tg.includes(x));
  const n = (...fs) => v.list.filter((t) => fs.every((f) => f(t))).length;
  const why = S.search ? `Nothing matches “${h(S.search)}” with these filters.` : S.only ? 'Nothing picked shows with these filters.' : 'No titles with these filters.';
  const reset = '<button class="link" data-act="reset">Reset search and filters</button>';
  if (S.e === 'E2') { const opts = [q && [`Clear the search “${h(S.search)}”`, 'search', n(st, yr, gt)], S.statuses.size < ALLST.length && ['Look in every list status', 'status', n(hit, yr, gt)], S.year && [`Look in all years, not only ${S.year}`, 'year', n(hit, st, gt)], S.genres.size + S.tags.size && ['Clear genres and tags', 'gt', n(hit, st, yr)]].filter((o) => o && o[2]);
    return `<div class="nomatch"><div class="k">(・_・?)</div><b>No titles match</b><span>${opts.length ? 'One change brings titles back:' : why}</span>${opts.map(([l, k, c]) => `<button class="mini-b" data-act="drop" data-id="${k}">${l}<b>${c} ${c === 1 ? 'title' : 'titles'}</b></button>`).join('')}${opts.length > 1 || !opts.length ? reset : ''}</div>`; }
  if (S.e === 'E3') return `<div class="nomatch e3"><span>No titles match. ${reset}</span></div>`;
  if (S.e === 'E4') { const out = q ? v.list.filter((t) => hit(t)).slice(0, 24) : [];
    return out.length ? `<div class="out"><b>Nothing matches “${h(S.search)}” with these filters.</b><span class="small">${out.length} ${out.length === 1 ? 'title' : 'titles'} outside your filters ${out.length === 1 ? 'does' : 'do'}. You can pick ${out.length === 1 ? 'it' : 'them'} from here.</span></div>${out.map(card).join('')}`
      : `<div class="nomatch"><b>${q ? `No title on your list matches “${h(S.search)}”` : 'No titles match'}</b>${reset}</div>`; }
  if (S.e === 'E5') return `<div class="nomatch e5"><div class="face">(・_・?)</div><b>No titles match</b><span>${why}</span><div class="row2"><button class="go" data-act="reset">Reset everything</button>${S.statuses.size < ALLST.length ? '<button class="mini-b" data-act="drop" data-id="status">Look in every list status</button>' : ''}</div></div>`;
  return `<div class="nomatch"><div class="k">(・_・?)</div><b>No titles match</b><span>${why}</span>${reset}</div>`;
}
/* ---- settled: genres and tags in one dialog (G5), nothing listed in the rail ---- */
const TAGMAX = 60, nGT = () => S.genres.size + S.tags.size, nF = () => S.statuses.size + (S.year ? 1 : 0) + nGT() + (S.search ? 1 : 0);
const more = (v) => v.tagsHit.length > TAGMAX ? `<span class="small fine" style="padding:6px">+ ${v.tagsHit.length - TAGMAX} more. Search to find them.</span>` : '';
const gChips = (v) => `<div class="gchips">${v.genres.map((g) => `<button class="gc ${S.genres.has(g) ? 'on' : ''}" data-act="genre" data-id="${h(g)}" ${v.gc[g] || S.genres.has(g) ? '' : 'disabled'}>${h(g)}<span class="cnt">${v.gc[g] || 0}</span></button>`).join('')}</div>`;
const tChips = (v) => `<div class="gchips">${v.tagsHit.slice(0, TAGMAX).map((x) => `<button class="gc t ${S.tags.has(x) ? 'on' : ''}" data-act="tag" data-id="${h(x)}">${h(x)}<span class="cnt">${v.tc[x] || 0}</span></button>`).join('')}</div>${more(v)}`;
const gBtn = () => `<button class="gbtn" data-act="pop" data-id="more">Genres and tags…<span class="v">${nGT() ? nGT() + ' chosen' : 'Any'}</span></button>`;
const gDlg = (v) => S.pop === 'more' ? `<div class="dscrim"><div class="dlg gm"><div class="scy" data-keep><div class="h2">Genres and tags</div><span class="small">Shows titles that have every genre and tag you choose. ${v.rows.length} titles match now.</span>
  <div class="lab">Genres</div>${gChips(v)}<div class="lab">Tags</div><label class="srch"><span>⌕</span><input data-in="tq" placeholder="Search ${v.nTags} tags" value="${h(S.tq)}"></label>${tChips(v)}</div>
  <div class="btns"><button class="sec" data-act="gclear">Clear all</button><button class="go" data-act="pop" data-id="">Show ${v.rows.length} titles</button></div></div></div>` : '';
/* ---- settled: the bar above the wall (P2), the plain question (M1) ---- */
const whead = (v) => `<div class="whead"><span class="strong cntl"><b>${v.rows.length}</b> shown</span>${fPick(v)}${fAdd(v)}<span class="grow"></span>${fOnly(v)}${fClear(v)}</div>`;
const ask = () => S.dlg ? `<div class="dscrim"><div class="dlg"><div class="h2">Pick them again?</div><p>${UNS.length} titles were not settled when your last Keep My Scale Ranking ended. Do you want them picked again?</p>
  <div class="btns"><button class="sec" data-act="uno">Not now</button><button class="go" data-act="uyes">Pick them again</button></div></div></div>` : '';
const filtersBody = (v) => `<div class="lab">List status</div>${fChecks(v)}<div class="lab">Release year</div>${fYear(v)}${gBtn()}<div class="lab">Sort</div>${fSort()}`;
const railHtml = (v) => `<aside class="rail"><div class="rh">${fBack()}<button class="rtog" data-act="rail" title="Hide filters">«</button></div><div class="h1">Choose titles</div>${fSearch()}${filtersBody(v)}</aside>`;
const lineHtml = (v) => `<div class="fbar"><button class="rtog" data-act="rail" title="Show filters">»</button>${fBack()}${fSearch()}${tokens()}</div>`;
const wallHtml = (v) => `<div class="wall" data-scroll>${v.rows.map(card).join('')}${noMatch(v)}</div>`;

/* ---- H · the phone: where the filters go ---- */
const fBtn = (label) => `<button class="fb" data-act="rail">☰${label ? ' ' + label : ''}<i>${nF()}</i></button>`;
const sheet = (v) => S.open ? `<div class="scrim" data-act="rail"></div><div class="psheet" data-keep><div class="grab"></div>${filtersBody(v)}<button class="go" data-act="rail">Show ${v.rows.length} titles</button></div>` : '';
const PHONE = {
  H1: (v) => ({ top: S.open ? railHtml(v) : lineHtml(v) }),
  H2: (v) => ({ top: `<div class="ptop">${fBack()}${fSearch()}${fBtn('')}</div>`, over: sheet(v) }),
  H3: (v) => ({ top: `<div class="ptop">${fBack()}<div class="h1 grow">Choose titles</div>${fBtn('Filters')}</div><div class="psum">${S.search ? `“${h(S.search)}” · ` : ''}${[...S.statuses].map((k) => ST[k][0]).join(', ') || 'No status'} · ${S.year || 'All years'}${nGT() ? ` · ${nGT()} genres and tags` : ''}</div>`,
    over: S.open ? `<div class="ppage"><div class="ptop"><div class="h1 grow">Filters</div><button class="rtog" data-act="rail">✕</button></div><div class="pb" data-keep>${fSearch()}${filtersBody(v)}</div><div class="pf"><button class="go" data-act="rail">Show ${v.rows.length} titles</button></div></div>` : '' }),
  H4: (v) => ({ top: `<div class="ptop">${fBack()}${fSearch()}</div><div class="crow" data-keep>${ALLST.map((k) => `<button class="chip ${S.statuses.has(k) ? 'on' : ''}" data-act="status" data-id="${k}">${ST[k][0]}</button>`).join('')}<span class="sep"></span>${fYear(v)}<button class="chip ${nGT() ? 'on' : ''}" data-act="pop" data-id="more">Genres and tags${nGT() ? ' · ' + nGT() : ''}</button>${fSort()}</div>` }),
  H5: (v) => ({ top: `<div class="ptop">${fBack()}${fSearch()}</div>`, over: sheet(v), dock: `<button class="dfil" data-act="rail" title="Filters">☰<i>${nF()}</i></button>` }),
};

function screen(v) {
  if (S.phone) { const p = PHONE[S.h](v);
    return `<div class="scr phone"><div class="body"><div class="col">${p.top}${whead(v)}<div class="ww">${wallHtml(v)}${dock(v, p.dock)}</div></div></div>${p.over || ''}${gDlg(v)}${ask()}</div>`; }
  return `<div class="scr"><div class="body">${S.open ? railHtml(v) : ''}<div class="col">${S.open ? '' : lineHtml(v)}${whead(v)}<div class="ww">${wallHtml(v)}${dock(v)}</div></div></div>${gDlg(v)}${ask()}</div>`;
}

/* ---- render + events ---- */
const app = document.getElementById('app'), pp = document.getElementById('pp');
function render() {
  const act = document.activeElement, fk = act && act.dataset && act.tagName === 'INPUT' ? act.dataset.in : '', caret = fk ? [act.selectionStart, act.selectionEnd] : null;
  const tops = [...app.querySelectorAll('[data-scroll],.rail,[data-keep]')].map((e) => e.scrollTop), key = S.h + S.phone + S.open + S.pop, was = app.dataset.d;
  app.innerHTML = screen(view()) + (S.toast ? `<div class="toast">${S.toast}</div>` : '');
  app.dataset.d = key;
  if (was === key) app.querySelectorAll('[data-scroll],.rail,[data-keep]').forEach((e, i) => (e.scrollTop = tops[i] || 0));
  if (fk) { const i = app.querySelector(`[data-in=${fk}]`); if (i) { i.focus(); i.setSelectionRange(caret[0], caret[1]); } }
  document.documentElement.classList.toggle('dark', S.dark); document.body.classList.toggle('phone', S.phone);
  pp.querySelectorAll('.ax').forEach((row) => { const a = row.dataset.ax, [label, opts] = AXES[a], i = opts.findIndex((o) => o[0] === S[a]);
    row.classList.toggle('on', S.ax === a); row.querySelector('.name').innerHTML = `<small>${label} · ${i + 1}/${opts.length}</small><b>${opts[i][0]} · ${opts[i][1]}</b>`; });
  pp.querySelectorAll('[data-p]').forEach((b) => b.classList.toggle('on', b.dataset.p === S.preset));
  for (const t of ['phone', 'dark', 'open']) pp.querySelector(`[data-t=${t}]`).classList.toggle('on', S[t]);
  history.replaceState(null, '', '#' + [S.h, S.e, S.open ? '' : 'closed', S.preset, S.phone ? 'phone' : '', S.dark ? 'dark' : ''].filter(Boolean).join(','));
}
app.addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, id = b.dataset.id, flip = (set, k) => (set.has(k) ? set.delete(k) : set.add(k)), v = view();
  S.toast = '';
  if (a === 'tick') flip(S.picked, Number(id));
  else if (a === 'status') flip(S.statuses, id);
  else if (a === 'genre') flip(S.genres, id);
  else if (a === 'tag') flip(S.tags, id);
  else if (a === 'genreadd') { S.genres.add(id); S.tq = ''; }
  else if (a === 'tagadd') { S.tags.add(id); S.tq = ''; }
  else if (a === 'gclear') { S.genres.clear(); S.tags.clear(); S.tq = ''; }
  else if (a === 'pop') { S.pop = id; S.tq = ''; }
  else if (a === 'pickall') v.rows.forEach((t) => S.picked.add(t.id));
  else if (a === 'unpick') v.rows.forEach((t) => S.picked.delete(t.id));
  else if (a === 'addall') v.list.forEach((t) => { if (!t.score && S.statuses.has(t.status) && (!S.year || String(t.year) === S.year) && [...S.genres].every((g) => t.g.includes(g)) && [...S.tags].every((x) => t.tg.includes(x))) S.picked.add(t.id); });
  else if (a === 'clear') S.picked.clear();
  else if (a === 'only') S.only = !S.only;
  else if (a === 'year') S.year = id;
  else if (a === 'drop') { if (id === 'search') S.search = ''; else if (id === 'year') S.year = ''; else if (id === 'status') S.statuses = new Set(Object.keys(ST)); else { S.genres.clear(); S.tags.clear(); } }
  else if (a === 'rail') { S.open = !S.open; S.pop = ''; }
  else if (a === 'uns') flip(S.uns, Number(id));
  else if (a === 'uyes') { (S.m === 'M3' ? UNS.filter((t) => S.uns.has(t.id)) : UNS).forEach((t) => S.picked.add(t.id)); S.dlg = false; S.statuses.add('DROPPED'); }
  else if (a === 'uno') S.dlg = false;
  else if (a === 'reset') { S.search = ''; S.year = ''; S.only = false; S.statuses = new Set(['COMPLETED', 'REPEATING']); S.genres.clear(); S.tags.clear(); }
  else if (a === 'go') S.toast = `Prototype: the Duels would start here with ${S.picked.size} titles.`;
  else if (a === 'back') S.toast = 'Prototype: back to Start.';
  if (S.pop === 'bulk' && a !== 'pop') S.pop = '';
  render();
});
app.addEventListener('input', (e) => { const k = e.target.dataset.in; if (k) { S[k] = e.target.value; render(); } });

pp.innerHTML = `<div class="grip"><span>PROTOTYPE · Picker #63 · final</span><span>⠿</span></div>
  ${Object.keys(AXES).map((a) => `<div class="ax" data-ax="${a}"><button data-n="-1">←</button><div class="name"></div><button data-n="1">→</button></div>`).join('')}
  <div class="hint">Final design. Try the states below.</div>
  <div class="sts">${STATES.map(([k, l]) => `<button data-p="${k}">${l}</button>`).join('')}<hr><button data-t="open">Rail open</button><button data-t="phone">📱 Phone</button><button data-t="dark">🌙 Dark</button></div>`;
const step = (n) => { const opts = AXES[S.ax][1], i = opts.findIndex((o) => o[0] === S[S.ax]); S[S.ax] = opts[(i + n + opts.length) % opts.length][0]; S.pop = ''; S.tq = '';
  render(); };
pp.addEventListener('click', (e) => {
  const row = e.target.closest('.ax'), b = e.target.closest('button');
  if (row) { S.ax = row.dataset.ax; return b && b.dataset.n ? step(Number(b.dataset.n)) : render(); }
  if (!b) return;
  if (b.dataset.p) preset(b.dataset.p); else if (b.dataset.t) S[b.dataset.t] = !S[b.dataset.t];
  render();
});
document.addEventListener('keydown', (e) => {
  if (e.target.closest('input,textarea,select,[contenteditable]')) return;
  const ks = Object.keys(AXES), i = ks.indexOf(S.ax);
  if (e.key === 'ArrowLeft') step(-1); else if (e.key === 'ArrowRight') step(1);
  else if (e.key === 'ArrowUp') { S.ax = ks[(i + ks.length - 1) % ks.length]; render(); } else if (e.key === 'ArrowDown') { S.ax = ks[(i + 1) % ks.length]; render(); } else return;
  e.preventDefault();
});
pp.querySelector('.grip').addEventListener('pointerdown', (e) => {
  const r = pp.getBoundingClientRect(), dx = e.clientX - r.left, dy = e.clientY - r.top;
  const move = (m) => Object.assign(pp.style, { left: m.clientX - dx + 'px', top: m.clientY - dy + 'px', right: 'auto', bottom: 'auto' });
  addEventListener('pointermove', move); addEventListener('pointerup', () => removeEventListener('pointermove', move), { once: true });
});

const hash = location.hash.slice(1).split(',');
preset(hash.find((x) => STATES.some((s) => s[0] === x)) || 'mix');
for (const a in AXES) { const hit = hash.find((x) => AXES[a][1].some((o) => o[0] === x)); if (hit) S[a] = hit; }
S.open = !hash.includes('closed'); S.phone = hash.includes('phone'); S.dark = hash.includes('dark');
render();
</script>
</body>
</html>
