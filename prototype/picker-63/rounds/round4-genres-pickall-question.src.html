<script>
const DATA = /*DATA*/null;
const BASE = DATA.base, ALL = DATA.base.concat(DATA.extra);
const ST = { COMPLETED: ['Completed', '#3fae5a'], REPEATING: ['Repeating', '#3db4f2'], CURRENT: ['Watching', '#f2a03d'], PAUSED: ['Paused', '#8f67d8'], DROPPED: ['Dropped', '#e05555'] };
const AXES = {
  g: ['Genres + tags', [['G1', 'Two buttons, fly-out lists'], ['G2', 'Genre chips + tag typeahead'], ['G3', 'One box for both'], ['G4', 'Accordion in the rail'], ['G5', 'One big dialog']]],
  p: ['Pick many', [['P1', 'Buttons in the rail'], ['P2', 'Bar above the wall'], ['P3', 'One "Pick…" menu'], ['P4', 'Floating, beside the dock'], ['P5', 'Tick-all box + menu']]],
  m: ['Unsettled question', [['M1', 'Plain dialog'], ['M2', 'Dialog with covers'], ['M3', 'Dialog, tick which ones'], ['M4', 'Full-screen step'], ['M5', 'Banner inside the Picker']]],
};
const STATES = [['empty', 'Nothing picked'], ['catchup', 'From Catch-up'], ['mix', 'Mix'], ['few', 'Too few Anchors'], ['long', '1000+ titles'], ['nomatch', 'No match'], ['dialog', 'Unsettled question']];
const SORTS = [['default', 'No score first, then newest'], ['title', 'Title'], ['score', 'Score'], ['year', 'Release year']];
const UNS = ['Hyouka', 'Made in Abyss', 'Tokyo Ghoul'].map((n) => BASE.find((t) => t.title === n));
const S = { g: 'G1', p: 'P1', m: 'M1', ax: 'g', open: true, preset: 'mix', phone: false, dark: false, picked: new Set(), statuses: new Set(), genres: new Set(), tags: new Set(), tq: '', pop: '', dlg: false, uns: new Set(),
  year: '', search: '', sort: 'default', only: false, long: false, toast: '' };

function preset(p) {
  Object.assign(S, { preset: p, long: p === 'long', search: p === 'nomatch' ? 'zzz' : '', year: '', sort: 'default', only: false, toast: '', tq: '', pop: '', dlg: p === 'dialog' });
  S.statuses = new Set(['COMPLETED', 'REPEATING']); S.genres = new Set(); S.tags = new Set(); S.uns = new Set(UNS.map((t) => t.id));
  const un = BASE.filter((t) => !t.score), sc = BASE.filter((t) => t.score);
  const ts = p === 'empty' || p === 'dialog' ? [] : p === 'catchup' ? un.filter((t) => t.status === 'COMPLETED' || t.status === 'REPEATING')
    : p === 'few' ? un.slice(0, 3).concat(sc.slice(0, 10)) : un.slice(0, 5).concat([sc[2], sc[9], sc[19]]);
  S.picked = new Set(ts.map((t) => t.id));
}

function view() {
  const list = S.long ? ALL : BASE, P = S.picked;
  const okF = (t) => S.statuses.has(t.status) && (!S.year || String(t.year) === S.year) && [...S.genres].every((g) => t.g.includes(g)) && [...S.tags].every((x) => t.tg.includes(x));
  const q = S.search.trim().toLowerCase();
  const byT = (a, b) => a.title.localeCompare(b.title);
  const cmp = { default: (a, b) => !!a.score - !!b.score || b.done - a.done || byT(a, b), title: byT, score: (a, b) => b.score - a.score || byT(a, b), year: (a, b) => (b.year || 0) - (a.year || 0) || byT(a, b) };
  const pass = list.filter(okF);
  const rows = pass.filter((t) => (!q || t.title.toLowerCase().includes(q)) && (!S.only || P.has(t.id))).sort(cmp[S.sort]);
  const picked = list.filter((t) => P.has(t.id));
  const anchors = list.filter((t) => t.score && !P.has(t.id));
  const scores = new Set(anchors.map((t) => t.score));
  const cnt = {}, gc = {}, tc = {};
  list.forEach((t) => { cnt[t.status] = (cnt[t.status] || 0) + 1; });
  pass.forEach((t) => { t.g.forEach((g) => (gc[g] = (gc[g] || 0) + 1)); t.tg.forEach((x) => (tc[x] = (tc[x] || 0) + 1)); });
  const reason = !picked.length ? 'Nothing picked yet.' : anchors.length < 20 ? `Only ${anchors.length} Anchors left, 20 needed. Untick some titles that have a score.` : scores.size < 3 ? `Anchors left on only ${scores.size} scores, 3 needed. Untick some titles that have a score.` : '';
  const tq = S.tq.trim().toLowerCase();
  return { list, rows, picked, anchors, scores: scores.size, cnt, gc, tc, reason, blocked: !!reason && picked.length > 0,
    genres: [...new Set(list.flatMap((t) => t.g))].sort(), nTags: new Set(list.flatMap((t) => t.tg)).size,
    tagsHit: [...new Set(list.flatMap((t) => t.tg))].filter((x) => (tc[x] || S.tags.has(x)) && (!tq || x.toLowerCase().includes(tq))).sort((a, b) => (tc[b] || 0) - (tc[a] || 0) || a.localeCompare(b)),
    pickN: rows.filter((t) => !P.has(t.id)).length,
    rescored: picked.filter((t) => t.score).length, addN: pass.filter((t) => !t.score && !P.has(t.id)).length,
    duels: picked.length * (Math.ceil(Math.log2(scores.size + 1)) + 2), years: [...new Set(list.map((t) => t.year).filter(Boolean))].sort((a, b) => b - a) };
}

/* ---- shared fragments ---- */
const h = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const cv = (t) => t.cover ? `<img class="cv" loading="lazy" src="${t.cover}" style="--c:${t.color || '#3db4f2'}" alt="">` : `<span class="cv ph" style="--c:${t.color || '#3db4f2'}"></span>`;
const on = (t) => S.picked.has(t.id) ? 'on' : '';
const repl = (t) => S.picked.has(t.id) && t.score;
const tick = (t) => `data-act="tick" data-id="${t.id}"`;
const fSearch = () => `<label class="srch"><span>⌕</span><input data-in="search" placeholder="Search titles" value="${h(S.search)}"></label>`;
const fChecks = (v) => `<div class="sts">${Object.keys(ST).map((k) => `<button class="ck" data-act="status" data-id="${k}"><span class="box ${S.statuses.has(k) ? 'on' : ''}">✓</span>${ST[k][0]}<span class="cnt">${v.cnt[k] || 0}</span></button>`).join('')}</div>`;
const fYear = (v) => `<select class="lsel" data-in="year"><option value="">All years</option>${v.years.map((y) => `<option ${S.year == y ? 'selected' : ''}>${y}</option>`).join('')}</select>`;
const fSort = () => `<select class="lsel" data-in="sort">${SORTS.map(([k, l]) => `<option value="${k}" ${S.sort === k ? 'selected' : ''}>Sort: ${l}</option>`).join('')}</select>`;
const fPick = (v) => `<button class="mini-b" data-act="pickall" ${v.pickN ? '' : 'disabled'}>✓ Pick all ${v.rows.length} shown</button>`;
const fAdd = (v) => `<button class="mini-b" data-act="addall" ${v.addN ? '' : 'disabled'}>＋ Add ${v.addN} without a score</button>`;
const fClear = (v) => `<button class="mini-b" data-act="clear" ${v.picked.length ? '' : 'disabled'}>Clear picks</button>`;
const fOnly = (v) => `<button class="mini-b ${S.only ? 'on' : ''}" data-act="only">Picked only (${v.picked.length})</button>`;
const fBack = () => `<button class="back" data-act="back">← Start</button>`;
const fGo = (v) => `<button class="go" data-act="go" ${v.reason ? 'disabled' : ''}>Start Duels</button>`;
const noMatch = (v) => v.rows.length ? '' : `<div class="nomatch"><div class="k">(・_・?)</div><b>No titles match</b><span>${S.search ? `Nothing matches “${h(S.search)}” with these filters.` : S.only ? 'Nothing picked shows with these filters.' : 'No titles with these filters.'}</span><button class="link" data-act="reset">Reset search and filters</button></div>`;
const stack = (ts) => ts.length ? `<div class="stack">${ts.slice(0, 6).map(cv).join('')}</div>` : '';
const card = (t) => `<button class="cd ${on(t)}" ${tick(t)}><span class="im">${cv(t)}<span class="tk">✓</span><span class="bs ${t.score ? '' : 'none'} ${repl(t) ? 're' : ''}">${t.score ? (repl(t) ? `${t.score} → ?` : t.score) : 'no score'}</span></span>
  <span class="tt">${h(t.title)}</span><span class="mt">${t.year || '—'} · ${ST[t.status][0]}</span></button>`;
const dock = (v) => `<div class="dock">${stack(v.picked)}<div class="tx"><b>${v.picked.length} picked${v.rescored ? ` · ${v.rescored} replace a score` : ''}</b><span class="${v.blocked ? 'why' : ''}">${v.reason || `${v.anchors.length} Anchors left on ${v.scores} scores · ≈ ${v.duels} Duels`}</span></div>${fGo(v)}</div>`;
const tokens = () => [...S.statuses].map((k) => `<span class="tok">${ST[k][0]}<button data-act="status" data-id="${k}"><b>✕</b></button></span>`).join('') + (S.year ? `<span class="tok">${S.year}<button data-act="year" data-id=""><b>✕</b></button></span>` : '') + gtoks();
const gtoks = () => [...S.genres].map((g) => `<span class="tok g">${h(g)}<button data-act="genre" data-id="${h(g)}"><b>✕</b></button></span>`).join('') + [...S.tags].map((x) => `<span class="tok t">${h(x)}<button data-act="tag" data-id="${h(x)}"><b>✕</b></button></span>`).join('');

/* ---- G · genre and tag filters: { rail, over } ---- */
const TAGMAX = 60;
const tagSearch = (v, ph) => `<label class="srch"><span>⌕</span><input data-in="tq" placeholder="${ph || `Search ${v.nTags} tags`}" value="${h(S.tq)}"></label>`;
const gChecks = (v) => `<div class="clist">${v.genres.map((g) => `<button class="ck" data-act="genre" data-id="${h(g)}" ${v.gc[g] || S.genres.has(g) ? '' : 'disabled'}><span class="box ${S.genres.has(g) ? 'on' : ''}">✓</span>${h(g)}<span class="cnt">${v.gc[g] || 0}</span></button>`).join('')}</div>`;
const tChecks = (v) => `<div class="clist">${v.tagsHit.slice(0, TAGMAX).map((x) => `<button class="ck" data-act="tag" data-id="${h(x)}"><span class="box ${S.tags.has(x) ? 'on' : ''}">✓</span>${h(x)}<span class="cnt">${v.tc[x] || 0}</span></button>`).join('') || '<span class="small fine" style="padding:6px">No tag matches.</span>'}${more(v)}</div>`;
const more = (v) => v.tagsHit.length > TAGMAX ? `<span class="small fine" style="padding:6px">+ ${v.tagsHit.length - TAGMAX} more. Search to find them.</span>` : '';
const gChips = (v) => `<div class="gchips">${v.genres.map((g) => `<button class="gc ${S.genres.has(g) ? 'on' : ''}" data-act="genre" data-id="${h(g)}" ${v.gc[g] || S.genres.has(g) ? '' : 'disabled'}>${h(g)}<span class="cnt">${v.gc[g] || 0}</span></button>`).join('')}</div>`;
const tChips = (v) => `<div class="gchips">${v.tagsHit.slice(0, TAGMAX).map((x) => `<button class="gc t ${S.tags.has(x) ? 'on' : ''}" data-act="tag" data-id="${h(x)}">${h(x)}<span class="cnt">${v.tc[x] || 0}</span></button>`).join('')}</div>${more(v)}`;
const val = (set) => `<span class="v">${[...set].join(', ') || 'Any'}</span>`;
const GEN = {
  G1: (v) => ({ rail: `<div class="lab">Genres and tags</div><button class="gbtn ${S.pop === 'genre' ? 'on' : ''}" data-act="pop" data-id="genre">Genres${val(S.genres)}<span>▸</span></button><button class="gbtn ${S.pop === 'tag' ? 'on' : ''}" data-act="pop" data-id="tag">Tags${val(S.tags)}<span>▸</span></button>`,
    over: S.pop === 'genre' ? `<div class="fly"><div class="lab">Genres · titles with all ticked</div>${gChecks(v)}<button class="mini-b" data-act="pop" data-id="" style="justify-content:center">Done</button></div>`
      : S.pop === 'tag' ? `<div class="fly"><div class="lab">Tags · titles with all ticked</div>${tagSearch(v)}${tChecks(v)}<button class="mini-b" data-act="pop" data-id="" style="justify-content:center">Done</button></div>` : '' }),
  G2: (v) => ({ rail: `<div class="lab">Genres</div>${gChips(v)}<div class="lab">Tags</div>${tagSearch(v)}${S.tq ? `<div class="sug">${v.tagsHit.slice(0, 7).map((x) => `<button data-act="tagadd" data-id="${h(x)}">${h(x)}<span class="cnt">${v.tc[x] || 0}</span></button>`).join('') || '<button disabled>No tag matches</button>'}</div>` : ''}
      ${S.tags.size ? `<div class="gchips">${[...S.tags].map((x) => `<span class="tok t">${h(x)}<button data-act="tag" data-id="${h(x)}"><b>✕</b></button></span>`).join('')}</div>` : ''}` }),
  G3: (v) => { const q = S.tq.trim().toLowerCase(), gs = q ? v.genres.filter((g) => g.toLowerCase().includes(q) && !S.genres.has(g)) : [];
    return { rail: `<div class="lab">Genres and tags</div>${tagSearch(v, 'Add a genre or tag…')}${q ? `<div class="sug">${gs.slice(0, 4).map((g) => `<button data-act="genreadd" data-id="${h(g)}"><span class="k">Genre</span>${h(g)}<span class="cnt">${v.gc[g] || 0}</span></button>`).join('')}${v.tagsHit.filter((x) => !S.tags.has(x)).slice(0, 6).map((x) => `<button data-act="tagadd" data-id="${h(x)}"><span class="k">Tag</span>${h(x)}<span class="cnt">${v.tc[x] || 0}</span></button>`).join('') || (gs.length ? '' : '<button disabled>Nothing matches</button>')}</div>` : ''}
      ${S.genres.size + S.tags.size ? `<div class="gchips">${gtoks()}</div>` : ''}` }; },
  G4: (v) => ({ rail: `<div class="acc"><button class="gbtn" data-act="pop" data-id="${S.pop === 'genre' ? '' : 'genre'}">Genres${val(S.genres)}<span>${S.pop === 'genre' ? '▾' : '▸'}</span></button>${S.pop === 'genre' ? gChecks(v) : ''}</div>
      <div class="acc"><button class="gbtn" data-act="pop" data-id="${S.pop === 'tag' ? '' : 'tag'}">Tags${val(S.tags)}<span>${S.pop === 'tag' ? '▾' : '▸'}</span></button>${S.pop === 'tag' ? tagSearch(v) + tChecks(v) : ''}</div>` }),
  G5: (v) => ({ rail: `<button class="gbtn" data-act="pop" data-id="more">Genres and tags…<span class="v">${S.genres.size + S.tags.size || 'Any'}</span></button>${S.genres.size + S.tags.size ? `<div class="gchips">${gtoks()}</div>` : ''}`,
    over: S.pop === 'more' ? `<div class="dscrim"><div class="dlg gm"><div class="h2">Genres and tags</div><span class="small">Shows titles that have every genre and tag you choose. ${v.rows.length} titles match now.</span>
      <div class="lab">Genres</div>${gChips(v)}<div class="lab">Tags</div>${tagSearch(v)}${tChips(v)}
      <div class="btns"><button class="sec" data-act="gclear">Clear all</button><button class="go" data-act="pop" data-id="">Show ${v.rows.length} titles</button></div></div></div>` : '' }),
};

/* ---- P · picking many at once: { rail, line, head, float } ---- */
const menu = (v) => S.pop === 'bulk' ? `<div class="menu"><button data-act="pickall" ${v.pickN ? '' : 'disabled'}>Pick all shown<span class="cnt">${v.rows.length}</span></button><button data-act="addall" ${v.addN ? '' : 'disabled'}>Add all without a score<span class="cnt">${v.addN}</span></button>
  <button data-act="unpick" ${v.rows.length - v.pickN ? '' : 'disabled'}>Unpick all shown<span class="cnt">${v.rows.length - v.pickN}</span></button><hr><button data-act="only">${S.only ? '✓ ' : ''}Show picked only<span class="cnt">${v.picked.length}</span></button><button data-act="clear" ${v.picked.length ? '' : 'disabled'}>Clear every pick<span class="cnt">${v.picked.length}</span></button></div>` : '';
const BULK = {
  P1: (v) => ({ rail: fPick(v) + fAdd(v) + fOnly(v) + fClear(v), line: fPick(v) + fAdd(v) }),
  P2: (v) => ({ head: `<div class="whead"><span class="strong"><b>${v.rows.length}</b> shown</span>${fPick(v)}${fAdd(v)}<span class="grow"></span>${fOnly(v)}${fClear(v)}</div>` }),
  P3: (v) => { const b = `<span class="mw"><button class="mini-b ${S.pop === 'bulk' ? 'on' : ''}" data-act="pop" data-id="${S.pop === 'bulk' ? '' : 'bulk'}" style="padding:8px 12px">Pick… ▾</button>${menu(v)}</span>`; return { rail: b, line: b }; },
  P4: (v) => ({ float: `<div class="bulk4">${fPick(v)}${fAdd(v)}<div class="ln"><button class="link" data-act="only">${S.only ? 'Show all' : `Picked only (${v.picked.length})`}</button><button class="link" data-act="clear">Clear</button></div></div>` }),
  P5: (v) => { const all = v.rows.length && !v.pickN, some = v.rows.length - v.pickN > 0;
    return { head: `<div class="whead"><span class="mw"><span class="tri"><button data-act="${all ? 'unpick' : 'pickall'}" title="${all ? 'Unpick all shown' : 'Pick all shown'}"><span class="box ${all ? 'on' : some ? 'mid' : ''}">${all ? '✓' : '–'}</span>${v.rows.length} shown</button><button class="car" data-act="pop" data-id="${S.pop === 'bulk' ? '' : 'bulk'}">▾</button></span>${menu(v)}</span>
      <span class="small fine">${v.rows.length - v.pickN} of them picked</span><span class="grow"></span>${fOnly(v)}</div>` }; },
};

/* ---- M · the question before the Picker: { over, banner } ---- */
const uTxt = `${UNS.length} titles were not settled when your last Keep My Scale Ranking ended.`;
const uCov = (checks) => `<div class="ucov">${UNS.map((t) => `<button class="u ${checks && !S.uns.has(t.id) ? 'off' : ''}" ${checks ? `data-act="uns" data-id="${t.id}"` : ''}>${cv(t)}${checks ? `<span class="box ${S.uns.has(t.id) ? 'on' : ''}">✓</span>` : ''}<span>${h(t.title)}</span></button>`).join('')}</div>`;
const uBtns = (yes) => `<div class="btns"><button class="sec" data-act="uno">Not now</button><button class="go" data-act="uyes" ${yes === 0 ? 'disabled' : ''}>${yes == null ? 'Pick them again' : `Pick ${yes} again`}</button></div>`;
const ASK = {
  M1: () => ({ over: `<div class="dscrim"><div class="dlg"><div class="h2">Pick them again?</div><p>${uTxt} Do you want them picked again?</p>${uBtns()}</div></div>` }),
  M2: () => ({ over: `<div class="dscrim"><div class="dlg"><div class="h2">Pick them again?</div><p>${uTxt}</p>${uCov(false)}${uBtns()}</div></div>` }),
  M3: () => ({ over: `<div class="dscrim"><div class="dlg"><div class="h2">Pick them again?</div><p>${uTxt} Untick any you want to leave out.</p>${uCov(true)}${uBtns(S.uns.size)}</div></div>` }),
  M4: () => ({ over: `<div class="full"><div class="fan">${UNS.map((t, i) => cv(t).replace('style="', `style="--r:${(i - 1) * 7}deg;--y:${Math.abs(i - 1) * 10}px;`)).join('')}</div><div class="big">${UNS.length} titles are waiting</div><p>${uTxt} Pick them again, or start with nothing picked.</p>
    <div class="btns" style="display:flex;gap:10px"><button class="sec" data-act="uno" style="font-weight:800;color:var(--tx-strong);padding:13px 18px;border-radius:12px;background:var(--fg2)">Start with nothing</button><button class="go" data-act="uyes">Pick them again</button></div></div>` }),
  M5: () => ({ banner: `<div class="ban">${stack(UNS)}<span class="grow"><b>${UNS.length} titles left unsettled last time.</b> <span class="small">${UNS.map((t) => h(t.title)).join(', ')}</span></span><button class="mini-b" data-act="uno">Not now</button><button class="go" data-act="uyes" style="padding:8px 14px">Pick them again</button></div>` }),
};

function screen(v) {
  const g = GEN[S.g](v), p = BULK[S.p](v), m = S.dlg ? ASK[S.m](v) : {};
  const rail = `<aside class="rail"><div class="rh">${fBack()}<button class="rtog" data-act="rail" title="Hide filters">«</button></div><div class="h1">Choose titles</div>${fSearch()}
    <div class="lab">List status</div>${fChecks(v)}<div class="lab">Release year</div>${fYear(v)}${g.rail}<div class="lab">Sort</div>${fSort()}${p.rail || ''}</aside>`;
  const line = `<div class="fbar"><button class="rtog" data-act="rail" title="Show filters">»</button>${fBack()}${fSearch()}${tokens()}${p.line || ''}<span class="small fine">${v.rows.length} shown</span></div>`;
  return `<div class="scr"><div class="body">${S.open ? rail : ''}<div class="col">${S.open ? '' : line}${p.head || ''}<div class="ww"><div class="wall" data-scroll>${m.banner || ''}${v.rows.map(card).join('')}${noMatch(v)}</div>${p.float || ''}${dock(v)}</div></div></div>${(S.open && g.over) || ''}${m.over || ''}</div>`;
}

/* ---- render + events ---- */
const app = document.getElementById('app'), pp = document.getElementById('pp');
function render() {
  const act = document.activeElement, fk = act && act.dataset && act.tagName === 'INPUT' ? act.dataset.in : '', caret = fk ? [act.selectionStart, act.selectionEnd] : null;
  const tops = [...app.querySelectorAll('[data-scroll],.rail,.clist')].map((e) => e.scrollTop), key = S.g + S.p + S.open + S.pop, was = app.dataset.d;
  app.innerHTML = screen(view()) + (S.toast ? `<div class="toast">${S.toast}</div>` : '');
  app.dataset.d = key;
  if (was === key) app.querySelectorAll('[data-scroll],.rail,.clist').forEach((e, i) => (e.scrollTop = tops[i] || 0));
  if (fk) { const i = app.querySelector(`[data-in=${fk}]`); if (i) { i.focus(); i.setSelectionRange(caret[0], caret[1]); } }
  document.documentElement.classList.toggle('dark', S.dark); document.body.classList.toggle('phone', S.phone);
  pp.querySelectorAll('.ax').forEach((row) => { const a = row.dataset.ax, [label, opts] = AXES[a], i = opts.findIndex((o) => o[0] === S[a]);
    row.classList.toggle('on', S.ax === a); row.querySelector('.name').innerHTML = `<small>${label} · ${i + 1}/${opts.length}</small><b>${opts[i][0]} · ${opts[i][1]}</b>`; });
  pp.querySelectorAll('[data-p]').forEach((b) => b.classList.toggle('on', b.dataset.p === S.preset));
  for (const t of ['phone', 'dark', 'open']) pp.querySelector(`[data-t=${t}]`).classList.toggle('on', S[t]);
  history.replaceState(null, '', '#' + [S.g, S.p, S.m, S.open ? '' : 'closed', S.preset, S.phone ? 'phone' : '', S.dark ? 'dark' : ''].filter(Boolean).join(','));
}
app.addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, id = b.dataset.id, flip = (set, k) => (set.has(k) ? set.delete(k) : set.add(k)), v = view();
  S.toast = '';
  if (a === 'tick') flip(S.picked, Number(id));
  else if (a === 'status') flip(S.statuses, id);
  else if (a === 'genre') flip(S.genres, id);
  else if (a === 'tag') flip(S.tags, id);
  else if (a === 'genreadd') { S.genres.add(id); S.tq = ''; }
  else if (a === 'tagadd') { S.tags.add(id); S.tq = ''; }
  else if (a === 'gclear') { S.genres.clear(); S.tags.clear(); S.tq = ''; }
  else if (a === 'pop') { S.pop = id; S.tq = ''; }
  else if (a === 'pickall') v.rows.forEach((t) => S.picked.add(t.id));
  else if (a === 'unpick') v.rows.forEach((t) => S.picked.delete(t.id));
  else if (a === 'addall') v.list.forEach((t) => { if (!t.score && S.statuses.has(t.status) && (!S.year || String(t.year) === S.year) && [...S.genres].every((g) => t.g.includes(g)) && [...S.tags].every((x) => t.tg.includes(x))) S.picked.add(t.id); });
  else if (a === 'clear') S.picked.clear();
  else if (a === 'only') S.only = !S.only;
  else if (a === 'year') S.year = id;
  else if (a === 'rail') { S.open = !S.open; S.pop = ''; }
  else if (a === 'uns') flip(S.uns, Number(id));
  else if (a === 'uyes') { (S.m === 'M3' ? UNS.filter((t) => S.uns.has(t.id)) : UNS).forEach((t) => S.picked.add(t.id)); S.dlg = false; S.statuses.add('DROPPED'); }
  else if (a === 'uno') S.dlg = false;
  else if (a === 'reset') { S.search = ''; S.year = ''; S.only = false; S.statuses = new Set(['COMPLETED', 'REPEATING']); S.genres.clear(); S.tags.clear(); }
  else if (a === 'go') S.toast = `Prototype: the Duels would start here with ${S.picked.size} titles.`;
  else if (a === 'back') S.toast = 'Prototype: back to Start.';
  if (S.pop === 'bulk' && a !== 'pop') S.pop = '';
  render();
});
app.addEventListener('input', (e) => { const k = e.target.dataset.in; if (k) { S[k] = e.target.value; render(); } });

pp.innerHTML = `<div class="grip"><span>PROTOTYPE · Picker #63 · round 4</span><span>⠿</span></div>
  ${Object.keys(AXES).map((a) => `<div class="ax" data-ax="${a}"><button data-n="-1">←</button><div class="name"></div><button data-n="1">→</button></div>`).join('')}
  <div class="hint">↑/↓ choose the row · ←/→ switch its variant</div>
  <div class="sts">${STATES.map(([k, l]) => `<button data-p="${k}">${l}</button>`).join('')}<hr><button data-t="open">Rail open</button><button data-t="phone">📱 Phone</button><button data-t="dark">🌙 Dark</button></div>`;
const step = (n) => { const opts = AXES[S.ax][1], i = opts.findIndex((o) => o[0] === S[S.ax]); S[S.ax] = opts[(i + n + opts.length) % opts.length][0]; S.pop = ''; S.tq = '';
  if (S.ax === 'm') { S.dlg = true; S.preset = 'dialog'; } render(); };
pp.addEventListener('click', (e) => {
  const row = e.target.closest('.ax'), b = e.target.closest('button');
  if (row) { S.ax = row.dataset.ax; return b && b.dataset.n ? step(Number(b.dataset.n)) : render(); }
  if (!b) return;
  if (b.dataset.p) preset(b.dataset.p); else if (b.dataset.t) S[b.dataset.t] = !S[b.dataset.t];
  render();
});
document.addEventListener('keydown', (e) => {
  if (e.target.closest('input,textarea,select,[contenteditable]')) return;
  const ks = Object.keys(AXES), i = ks.indexOf(S.ax);
  if (e.key === 'ArrowLeft') step(-1); else if (e.key === 'ArrowRight') step(1);
  else if (e.key === 'ArrowUp') { S.ax = ks[(i + ks.length - 1) % ks.length]; render(); } else if (e.key === 'ArrowDown') { S.ax = ks[(i + 1) % ks.length]; render(); } else return;
  e.preventDefault();
});
pp.querySelector('.grip').addEventListener('pointerdown', (e) => {
  const r = pp.getBoundingClientRect(), dx = e.clientX - r.left, dy = e.clientY - r.top;
  const move = (m) => Object.assign(pp.style, { left: m.clientX - dx + 'px', top: m.clientY - dy + 'px', right: 'auto', bottom: 'auto' });
  addEventListener('pointermove', move); addEventListener('pointerup', () => removeEventListener('pointermove', move), { once: true });
});

const hash = location.hash.slice(1).split(',');
preset(hash.find((x) => STATES.some((s) => s[0] === x)) || 'mix');
for (const a in AXES) { const hit = hash.find((x) => AXES[a][1].some((o) => o[0] === x)); if (hit) S[a] = hit; }
S.open = !hash.includes('closed'); S.phone = hash.includes('phone'); S.dark = hash.includes('dark');
render();
</script>
</body>
</html>
