<html lang="en">

    <!-- Top Studios' old path (ADR 0015), kept for good (ADR 0016): it only forwards to /aniduel/anilyze/studios/, with
         the query and hash kept (src/studiosRedirect.ts). The head is Top Studios' own (anilyze/studios/index.html),
         so a link shared before the move still previews the same. -->

    <!-- Without a script: a static tag can't carry the query, so this lands on the bare page. -->
    <noscript>
      <meta http-equiv="refresh" content="0; url=/aniduel/anilyze/studios/" />
    </noscript>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Top Studios · AniDuel!</title>
    <meta
      name="description"
      content="Type an AniList username and see that user's top animation studios, ranked from their own scores, drops, rewatches and favourite anime."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AniDuel!" />

    <meta property="og:description" content="Type an AniList username and see their top animation studios." />
