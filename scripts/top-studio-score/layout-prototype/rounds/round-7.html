<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PROTOTYPE — Top Studios bubble map (#89, round 7)</title>
<style>
:root{--bg:#edf1f5;--fg:#fafafa;--fg2:#e5ebf1;--tx:#5c728a;--tx-strong:#2b2d42;--blue:#3db4f2;--nav:#2b2d42;--navtx:#bcbedc;--danger:#e05555;--warn:#f2b13d;--good:#3fae5a;--shadow:#0002;
--elite:#7cc6f5;--bold:#f5a46b;--reliable:#8fd19e;--meh:#b9b3c9;--pink:#ffb3c8;
--band-loved:#ffb3c8;--band-liked:#ffe08a;--band-okay:#bfe8c9;--band-meh:#c9d4ff;--band-ink:#4a3b52}
:root[data-theme=dark]{--bg:#0b1622;--fg:#151f2e;--fg2:#1f2a3c;--tx:#9fadbd;--tx-strong:#edf1f5;--nav:#0b1622;--navtx:#9fadbd;--shadow:#0006}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Overpass,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px;background:var(--bg);color:var(--tx);min-height:100vh}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
.strong{color:var(--tx-strong)} .fine{opacity:.7} .small{font-size:12px}
body.phone #stage{display:flex;justify-content:center;padding:24px 0 140px;background:repeating-linear-gradient(45deg,var(--bg),var(--bg) 12px,var(--fg2) 12px,var(--fg2) 24px)}
#app{container-type:inline-size;width:100%;background:var(--bg);min-height:100vh;position:relative}
body.phone #app{width:390px;min-height:760px;border-radius:28px;box-shadow:0 10px 40px var(--shadow);overflow:hidden;border:8px solid var(--nav)}
.hdr{background:var(--nav);color:var(--navtx);padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hdr .logo{font-weight:900;color:#fff;font-size:18px;display:flex;align-items:center;gap:8px}
.hdr .logo b{color:var(--blue)}
.mochi{width:34px;height:26px;background:var(--pink);border-radius:50% 50% 42% 42%/60% 60% 40% 40%;position:relative;flex:none;box-shadow:inset 0 -3px 0 #0001}
.mochi::before{content:'• ᴗ •';position:absolute;inset:0;display:grid;place-items:center;font-size:9px;color:#4a3b52;font-weight:700;letter-spacing:-1px}
.hdr form{display:flex;gap:6px;margin-left:auto}
.hdr input{font:inherit;padding:6px 10px;border-radius:6px;border:none;background:#ffffff1a;color:#fff;width:170px}
.hdr .go{background:var(--blue);color:#fff;border-radius:6px;padding:6px 12px;font-weight:700}
.hdr .back{font-size:12px;color:var(--navtx);text-decoration:underline;cursor:pointer}
@container (max-width:600px){.hdr{padding:10px 12px}.hdr form{margin-left:0;width:100%}.hdr input{flex:1;width:auto}}
.wrap{max-width:1100px;margin:0 auto;padding:20px}
@container (max-width:600px){.wrap{padding:12px}}
.who{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.who h1{font-size:22px;color:var(--tx-strong);font-weight:800}
.note{background:var(--fg);border-left:4px solid var(--warn);padding:8px 12px;border-radius:6px;margin-bottom:8px;font-size:13px}
.card{background:var(--fg);border-radius:10px;box-shadow:0 1px 3px var(--shadow)}
.lab{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:700;color:#2b2d42;white-space:nowrap}
.lab.elite{background:var(--elite)}.lab.bold{background:var(--bold)}.lab.reliable{background:var(--reliable)}.lab.meh{background:var(--meh)}
.S{font-variant-numeric:tabular-nums;font-weight:800;color:var(--tx-strong)}
.up{color:var(--good)} .down{color:var(--danger)}
img{display:block}

#picker{position:fixed;right:18px;bottom:18px;z-index:99;background:#1b1d2e;color:#eee;border-radius:12px;padding:10px 12px;box-shadow:0 8px 30px #0008;font-size:12px;width:310px;user-select:none}
#picker .grip{cursor:move;font-size:10px;opacity:.6;text-align:center;margin:-4px 0 4px}
#picker .nm{display:flex;align-items:center;gap:8px}
#picker .nm b{flex:1;text-align:center;font-size:14px}
#picker .nm button{background:#ffffff1a;border-radius:6px;padding:4px 10px;font-size:14px}
#picker .desc{opacity:.75;margin:6px 0 8px;text-align:center;line-height:1.35}
#picker .grp{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
#picker .grp button{background:#ffffff14;border-radius:5px;padding:3px 7px}
#picker .grp button.on{background:var(--blue);color:#fff}
#picker .k{opacity:.5;width:100%;margin-top:4px}

/* shared map bits */
.map{position:relative;border-radius:16px;overflow:hidden}
.map .pin{position:absolute;transform:translate(-50%,-50%);cursor:pointer;transition:transform .15s}
.map .pin:hover{transform:translate(-50%,-50%) scale(1.12);z-index:9}
.lay{display:grid;grid-template-columns:1fr 320px;gap:18px;align-items:start}
.lay>div{min-width:0}
@container (max-width:760px){.lay{grid-template-columns:1fr}}
.rlist .it{display:flex;gap:10px;padding:7px 10px;cursor:pointer;align-items:center;border-top:1px solid var(--fg2)}
.rlist .it:first-child{border-top:none}
.rlist .it.on{background:var(--fg2)}
.rlist .rk{width:20px;font-weight:800;text-align:right;color:var(--tx-strong)}
.av{width:30px;height:30px;border-radius:50%;object-fit:cover;flex:none;background:var(--fg2)}
.covers{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:12px}
.cv{position:relative}
.cv img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:8px;box-shadow:0 2px 6px var(--shadow)}
.cv .pb{position:absolute;top:6px;right:6px;font-size:11px;font-weight:800;padding:1px 6px;border-radius:99px;background:#fff;box-shadow:0 1px 3px #0004}
.cv .ct{font-size:11px;margin-top:4px;line-height:1.25;color:var(--tx-strong);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cv .cs{font-size:11px;opacity:.75}
.cv.dn img{filter:grayscale(.7) brightness(.9)}
.sec{font-size:13px;font-weight:800;color:var(--tx-strong);margin:14px 0 8px}

/* ===== 1: Cover bubbles ===== */
.V1 .map{aspect-ratio:1/.78;background:var(--fg)}
.V1 .q{position:absolute;width:50%;height:50%;display:flex;flex-direction:column;padding:14px 16px;font-weight:800;font-size:13px;color:var(--tx-strong)}
.V1 .q .big{font-size:64px;opacity:.13;position:absolute;filter:grayscale(.2)}
.V1 .q span{font-weight:400;font-size:11px;opacity:.75}
.V1 .bub{border-radius:50%;border:3px solid #fff;box-shadow:0 3px 10px #0003;overflow:visible;position:absolute;transform:translate(-50%,-50%);cursor:pointer;transition:transform .15s}
.V1 .bub img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.V1 .bub:hover{transform:translate(-50%,-50%) scale(1.15);z-index:9}
.V1 .bub .rb{position:absolute;bottom:-6px;right:-6px;background:var(--tx-strong);color:var(--fg);font-size:10px;font-weight:800;border-radius:99px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px;border:2px solid var(--fg)}
.V1 .bub .nmtag{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:6px;font-size:10px;font-weight:700;white-space:nowrap;color:var(--tx-strong);background:var(--fg);padding:0 5px;border-radius:4px;opacity:.95}
.V1 .bub.on{border-color:var(--blue);box-shadow:0 0 0 5px #3db4f266;z-index:8}
.V1 .bub.wl{border:3px dashed var(--good)}
.V1 .det{padding:0;overflow:hidden;margin-top:16px}
.V1 .banner{height:110px;background-size:cover;background-position:center;position:relative}
.V1 .banner::after{content:'';position:absolute;inset:0;background:linear-gradient(transparent,var(--fg))}
.V1 .dh{padding:0 18px;margin-top:-34px;position:relative;z-index:1;display:flex;gap:12px;align-items:flex-end}
.V1 .dh h3{font-size:22px;color:var(--tx-strong)}
.V1 .db{padding:12px 18px 18px}

.V1 .maphint{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);font-size:10px;opacity:.6;white-space:nowrap;z-index:1}
.V1 .bub .more{position:absolute;top:-6px;right:-8px;background:var(--blue);color:#fff;font-size:11px;font-weight:900;border-radius:99px;padding:1px 6px;border:2px solid var(--fg);cursor:pointer}
.V1 .fanscrim{position:absolute;inset:0;background:#0003;z-index:7;cursor:pointer}
.V1 .bub.fanned{z-index:9;animation:pop .2s}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.3);opacity:0}}
.V1 .bub img{background:var(--fg2)}
.shelf2{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 8px}
.shelf2 .cv{min-width:84px;max-width:84px}
.stackbar{display:flex;height:96px;border-radius:10px;overflow:hidden;gap:2px;background:var(--fg2)}
.stackbar .sl{min-width:3px;overflow:hidden;position:relative}
.stackbar .sl img{width:100%;height:100%;object-fit:cover}
.stackbar .pad{background:repeating-linear-gradient(45deg,var(--fg2),var(--fg2) 6px,var(--bg) 6px,var(--bg) 12px);display:grid;place-items:center;font-weight:900;color:var(--tx)}
.lst .lr{display:flex;align-items:center;gap:10px;padding:4px 0;border-top:1px solid var(--fg2);font-size:13px}
.lst .lr img{width:26px;height:38px;object-fit:cover;border-radius:4px}
.lst .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lst .pct{width:64px;text-align:right;font-weight:800;color:var(--tx-strong);background:linear-gradient(90deg,transparent calc(100% - var(--p)),#3db4f233 calc(100% - var(--p)));border-radius:4px;padding:0 4px}
.speech2{display:flex;gap:12px;align-items:center;background:var(--fg2);border-radius:12px;padding:10px 14px;margin-bottom:6px}
.speech2 p{color:var(--tx-strong);line-height:1.5}
.minimochi{width:52px;height:40px;background:var(--pink);border-radius:50% 50% 42% 42%/60% 60% 40% 40%;flex:none;display:grid;place-items:center;font-size:11px;font-weight:700;color:#4a3b52}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.covers.c6{grid-template-columns:repeat(3,minmax(0,1fr))}
.det{container-type:inline-size}
@container (max-width:600px){.two{grid-template-columns:1fr}}
.more2 summary{cursor:pointer;margin-top:14px;font-weight:700;color:var(--blue)}
.ladder{position:relative;display:flex;align-items:flex-end;gap:3px;min-height:160px;border-bottom:2px solid var(--fg2);padding-bottom:18px}
.ladder .col{flex:1;display:flex;flex-direction:column-reverse;align-items:center;gap:2px;position:relative}
.ladder .col img{width:100%;max-width:30px;aspect-ratio:2/3;object-fit:cover;border-radius:3px;box-shadow:0 1px 2px #0003}
.ladder .col img.drop{opacity:.35;filter:grayscale(1)}
.ladder .col img.fav{outline:2px solid #f2c94c;outline-offset:1px}
.ladder .tick{position:absolute;bottom:-18px;font-size:10px;opacity:.7}
.ladder .avgline{position:absolute;top:0;bottom:0;width:2px;background:var(--blue)}
.ladder .avgline::after{content:'your avg';position:absolute;top:-2px;left:4px;font-size:10px;color:var(--blue);white-space:nowrap}
.lay.wide{grid-template-columns:1fr 380px}
@container (max-width:760px){.lay.wide{grid-template-columns:1fr}}
.lay3{display:grid;grid-template-columns:320px 1fr;gap:18px;margin-top:16px;align-items:start}
.lay3>div{min-width:0}
.lay3 .det{margin-top:0}
.backbtn{font-weight:800;color:var(--blue);margin-bottom:8px}
.l2 .det{margin-top:0}
.inl{padding:0 0 10px}.inl .det{margin-top:0;border-radius:0;box-shadow:none}
.tabs{display:inline-flex;background:var(--fg2);border-radius:99px;padding:3px;margin-bottom:10px}
.tabs button{padding:5px 16px;border-radius:99px;font-weight:700}
.tabs button.on{background:var(--fg);color:var(--tx-strong);box-shadow:0 1px 3px var(--shadow)}
.scrim5{position:fixed;inset:0;background:#0005;z-index:20}
.drawer5{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);overflow:auto;z-index:21;background:var(--bg);padding:12px;animation:slide .2s}
.drawer5 .det{margin-top:0}
.x5{position:absolute;right:20px;top:20px;z-index:3;background:#000a;color:#fff;border-radius:50%;width:30px;height:30px}
@keyframes slide{from{transform:translateX(40px);opacity:0}}
body.phone .scrim5{position:absolute}
body.phone .drawer5{position:absolute;top:auto;height:82%;width:100%;border-radius:18px 18px 0 0;animation:none}
.tp{position:relative;display:inline-block}
.tp img{display:block}
.tp.drop img{filter:grayscale(1);opacity:.45}
.tp.fav img{outline:2px solid #f2c94c;outline-offset:1px}
.tp:hover{z-index:30}
.tp:hover::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 6px);transform:translateX(-50%);background:#1b1d2e;color:#fff;font-size:11px;padding:4px 8px;border-radius:6px;white-space:nowrap;pointer-events:none;z-index:40}
.unsc{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:12px}
.unsc img{width:26px;height:38px;object-fit:cover;border-radius:4px}
/* LD1 bookshelf */
.ld1 .shelfwrap{position:relative;display:flex;align-items:flex-end;gap:4px;padding:14px 8px 0;border-radius:12px;background:linear-gradient(var(--fg2),var(--fg))}
.ld1 .sc{flex:1;display:flex;flex-direction:column-reverse;align-items:center;position:relative;padding-bottom:22px;min-width:0}
.ld1 .sc::after{content:'';position:absolute;left:-2px;right:-2px;bottom:18px;height:6px;border-radius:3px;background:#c9a27a;box-shadow:0 2px 0 #8a6a4a}
.ld1 .sc .tp{margin-top:-14px;transition:transform .15s}.ld1 .sc .tp:last-of-type{margin-top:0}
.ld1 .sc .tp:hover{transform:translateY(-6px) scale(1.15)}
.ld1 .sc img{width:100%;max-width:38px;aspect-ratio:2/3;object-fit:cover;border-radius:4px;box-shadow:0 2px 4px #0004;border:1px solid #fff}
.ld1 .sc.below img{filter:saturate(.4);opacity:.8}
.ld1 .lbl{position:absolute;bottom:0;font-size:11px;font-weight:700}
.ld1 .ribbon{position:absolute;top:0;bottom:18px;width:3px;background:var(--blue);border-radius:2px}
.ld1 .ribbon span{position:absolute;top:2px;left:6px;font-size:10px;font-weight:800;color:#fff;background:var(--blue);padding:1px 6px;border-radius:99px;white-space:nowrap}
/* LD2 fans */
.ld2{display:flex;flex-wrap:wrap;gap:18px 10px;padding-top:8px}
.ld2 .fan{width:96px;text-align:center}
.ld2 .fan.below{opacity:.55;filter:saturate(.5)}
.ld2 .cards{height:92px;position:relative;display:flex;justify-content:center}
.ld2 .cards .tp{position:absolute;bottom:0;transform-origin:50% 100%;transition:transform .15s}
.ld2 .cards .tp:hover{transform:translateY(-10px) scale(1.1)!important}
.ld2 .cards img{width:52px;aspect-ratio:2/3;object-fit:cover;border-radius:6px;border:2px solid #fff;box-shadow:0 2px 6px #0003}
.ld2 .sk{display:inline-block;margin-top:6px;font-weight:900;color:var(--band-ink);border-radius:99px;padding:1px 10px}
.ld2 .cnt{font-size:11px;opacity:.7}
/* LD3 band rows */
.ld3 .brow{display:flex;gap:10px;align-items:center;margin:6px 0}
.ld3 .bp{flex:none;width:96px;border-radius:12px;padding:6px 8px;color:var(--band-ink);display:grid;grid-template-columns:1fr auto;gap:0 4px}
.ld3 .bp b{grid-column:1/-1;font-size:12px}
.ld3 .bp span{font-weight:800;font-size:12px}.ld3 .bp i{font-style:normal;font-size:11px;opacity:.7}
.ld3 .strip{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 8px;min-width:0}
.ld3 .strip .tp{flex:none}
.ld3 .strip img{width:46px;aspect-ratio:2/3;object-fit:cover;border-radius:6px;box-shadow:0 1px 3px #0003}
.ld3 .strip em{position:absolute;right:2px;bottom:2px;font-style:normal;font-size:10px;font-weight:900;background:#fffd;color:#2b2d42;border-radius:4px;padding:0 3px}
.ld3 .cut{flex:none;width:3px;background:var(--blue);border-radius:2px;position:relative;margin:0 6px}
.ld3 .cut i{position:absolute;top:-2px;left:5px;font-style:normal;font-size:10px;font-weight:800;color:#fff;background:var(--blue);border-radius:99px;padding:0 6px;white-space:nowrap}
.ld3 .tp.lo img{filter:saturate(.45);opacity:.8}
.ld3 .usual{display:flex;align-items:center;gap:8px;margin:8px 0;color:var(--blue);font-size:11px;font-weight:800}
.ld3 .usual::before,.ld3 .usual::after{content:'';flex:1;border-top:2px dashed var(--blue);opacity:.6}
/* LD4 swarm */
.ld4{position:relative;margin:8px 0 4px}
.ld4 .grad{position:absolute;left:0;right:0;top:0;bottom:26px;border-radius:14px;background:linear-gradient(90deg,#c9d4ff88,#bfe8c988 45%,#ffe08a88 70%,#ffb3c8aa)}
.ld4 .bee{position:absolute;transform:translate(-50%,-50%)}
.ld4 .bee img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid #fff;box-shadow:0 1px 4px #0004}
.ld4 .tk{position:absolute;bottom:4px;transform:translateX(-50%);font-size:11px;font-weight:700}
.ld4 .avg4{position:absolute;top:0;bottom:26px;border-left:2px dashed var(--blue)}
.ld4 .avg4 .mm{position:absolute;top:-14px;left:-17px;width:34px;height:24px;background:var(--pink);border-radius:50% 50% 42% 42%/60% 60% 40% 40%;font-size:8px;display:grid;place-items:center;color:#4a3b52;font-weight:700}
.ld4 .avg4 .t{position:absolute;bottom:2px;left:4px;font-size:10px;color:var(--blue);font-weight:800;white-space:nowrap}
/* LD5 histogram */
.ld5 .bars{position:relative;display:flex;align-items:flex-end;gap:5px;height:190px;padding-top:40px}
.ld5 .bc{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative;min-width:0}
.ld5 .bar{width:100%;border-radius:10px 10px 4px 4px;min-height:0;display:flex;justify-content:center;align-items:flex-end;padding-bottom:4px;font-size:11px;font-weight:900;color:var(--band-ink)}
.ld5 .peek{display:flex;justify-content:center;margin-bottom:-10px;z-index:1}
.ld5 .peek .tp{margin:0 -7px}
.ld5 .peek img{width:24px;aspect-ratio:2/3;object-fit:cover;border-radius:3px;border:1.5px solid #fff;box-shadow:0 1px 3px #0004}
.ld5 .lbl{position:absolute;bottom:-18px;font-size:11px;font-weight:700}
.ld5 .avg5{position:absolute;top:0;bottom:0;border-left:2px dashed var(--blue)}
.ld5 .minimochi.s{position:absolute;top:-4px;left:-24px;width:46px;height:34px}
.ld5{padding-bottom:4px}.ld5 .bars{margin-bottom:24px}
.rlist .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.S.big{font-size:20px}
.sbar{position:relative;width:64px;height:8px;background:var(--fg2);border-radius:4px;flex:none}
.sbar i{position:absolute;top:0;bottom:0;border-radius:4px}
.sbar b{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--tx)}
.hearts{color:#f27d9b;font-size:12px;letter-spacing:-1px;flex:none}.hearts s{text-decoration:none;opacity:.2}
.wlh{padding:8px 10px;border-top:1px dashed var(--good);font-size:12px}
.r2 .it{padding:8px 10px}.r2 .nm{display:flex;flex-direction:column;gap:3px}.r2 .sub{display:flex;gap:6px;align-items:center}
.av.sq{border-radius:6px;width:34px;height:48px}
.r3 .tc{display:flex;align-items:center;gap:10px;padding:14px;border-radius:12px;margin-bottom:8px;color:#fff;background-size:cover;background-position:center;cursor:pointer;box-shadow:0 2px 8px var(--shadow)}
.r3 .tc.on{outline:3px solid var(--blue)}
.r3 .tc .medal{font-size:24px}.r3 .tc .nm{display:flex;flex-direction:column}.r3 .tc .nm b{font-size:16px}.r3 .tc .nm span{font-size:11px;opacity:.85}
.r3 .tc .S{color:#fff}.r3 .tc .nm{flex:1;min-width:0}
.r4 .it{align-items:flex-start;padding:8px 10px}.r4 .nm{display:flex;flex-direction:column;gap:5px;white-space:normal}
.r4 .l1{display:flex;gap:6px;align-items:center}.r4 .l1 b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r4 .cvs{display:flex;gap:3px}.r4 .cvs img{width:26px;height:38px;object-fit:cover;border-radius:3px}
.r5 .it{border-left:5px solid var(--lc)}.r5 .it.on{background:color-mix(in srgb,var(--lc) 25%,transparent)}
.r5 .nm{display:flex;flex-direction:column}
/* ===== 2: Night sky ===== */
.V2{--sky:#0a1020}
.V2 .wrap{max-width:none;padding:0}
.V2 .skywrap{background:radial-gradient(ellipse at 30% 20%,#1d2b55 0%,#0a1020 60%);color:#cfd8ee;padding:20px}
.V2 .skywrap h1{color:#fff}

/* ===== 3: Four rooms ===== */

/* ===== 4: Polished map + cover list ===== */

@container (max-width:600px){.V5 .stk span{display:none}.V5 .stk{padding:3px}.V5 .stk.on span{display:inline}.V5 .q .kd{display:none}.V5 .map{aspect-ratio:1/1}}
</style>
</head>
<body>
<div id="stage"><div id="app"></div></div>
<div id="picker">
  <div class="grip">⠿ drag ⠿</div>
  <div class="nm"><button id="prev">←</button><b id="dname"></b><button id="next">→</button></div>
  <div class="desc" id="ddesc"></div>
  <div class="grp" id="gUser"></div>
  <div class="grp" id="gWidth"></div>
  <div class="grp" id="gTheme"></div>
  <div class="grp" id="gScore"><span>Score:</span></div>
  <div class="k">← / → switch design · click a studio to open it</div>
</div>
<script>
const DATA = /*DATA*/;
const USERS = [['zennnne','zennnne (normal)'],['ManMode','ManMode (scored < 50%)'],['Keennaja','Keennaja (gate lowered)']];
const LAB = {elite:['💎','Elite','Lots of hits, few flops','(♡˙︶˙♡)'],bold:['🎲','Bold','Lots of hits, and lots of flops too','(๑•̀ㅂ•́)و✧'],reliable:['🛡️','Reliable','Few hits, few flops','( ・_・)'],meh:['💤','Meh','Few hits, lots of flops','(´・ω・`)']};
const st = {d:+(localStorage.p89r7d||0), user:localStorage.p89u||'zennnne', phone:localStorage.p89w==='phone', theme:localStorage.p89t||'light', open:0, fan:-1, panel:false, tab:'map', fold:'ladder', foldOpen:false, sfmt:localStorage.p89sf||'raw'};
const D = () => DATA[st.user];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtS = s => (s>=0?'+':'−') + Math.abs(s).toFixed(2);
const lab = l => `<span class="lab ${l}">${LAB[l][0]} ${LAB[l][1]}</span>`;
const allStudios = () => [...D().ranked.map((r,i)=>({...r,rank:i+1,idx:i})), ...D().watch.map((r,j)=>({...r,rank:null,wl:true,idx:D().ranked.length+j}))];
const cur = () => allStudios()[st.open] || allStudios()[0];
const best = r => r.titles[0]; // titles sorted by push, biggest lift first
const cover = t => t && t.c ? t.c : '';
function why(t){const b=[]; if(t.score!=null) b.push(`you scored ${t.score}`); else if(t.status==='DROPPED') b.push('dropped, no score'); else if(t.rep) b.push('rewatched, no score'); else b.push('no score');
  if(t.fav) b.push('★'); if(t.status==='DROPPED'&&t.score!=null) b.push('dropped'); return b.join(' · ');}
function pushArrows(d){const a=Math.abs(d); const n=a>=0.05?3:a>=0.015?2:1; return (d>=0?'▲':'▼').repeat(n);}
function notes(){const d=D(), o=[];
  if(d.gate<6) o.push(`<div class="note">You have a short list, so a studio needed only <b>${d.gate} titles</b> (not 6) to be ranked.${d.rankedCount<10?` Only ${d.rankedCount} studios made it.`:''}</div>`);
  if(d.countedScoredFrac<0.5) o.push(`<div class="note">You scored only <b>${Math.round(d.countedScoredFrac*100)}%</b> of the titles that counted, so the labels may be off.</div>`);
  return o.join('');}
const hdr = () => `<div class="hdr"><div class="logo"><span class="mochi"></span>Top <b>Studios</b></div><span class="back">← AniDuel!</span>
  <form onsubmit="return false"><input value="${esc(st.user)}" placeholder="AniList username"><button class="go">Show</button></form></div>`;
const whoLine = () => `<div class="who"><h1>${esc(st.user)}’s top studios</h1><span class="fine small">${D().entries} titles watched · ${D().rankedCount} studios ranked</span></div>`;

/* position on the hit × flop plane: the label line sits in the middle of each axis */
function plane(maxN){
  const d=D(), h0=d.baseHit+0.06, f0=d.baseFlop+0.06, all=allStudios();
  const shown = all.filter(r=>r.wl || r.rank<=maxN);
  const mxH=Math.max(h0+0.1,...shown.map(r=>r.hit)), mxF=Math.max(f0+0.1,...shown.map(r=>r.flop));
  const px=f=>f<=f0? 4+f/f0*46 : 50+(f-f0)/(mxF-f0)*46, py=h=>h<=h0? 96-h/h0*46 : 50-(h-h0)/(mxH-h0)*46;
  return shown.map(r=>({r, x:px(r.flop), y:py(r.hit)}));
}
/* nudge apart overlapping pins; keep each pin inside its own quadrant */
function relax(pts, minD, aspect){
  for(let it=0;it<120;it++) for(let i=0;i<pts.length;i++) for(let j=i+1;j<pts.length;j++){
    const a=pts[i],b=pts[j]; let dx=(b.x-a.x), dy=(b.y-a.y)/aspect; let dist=Math.hypot(dx,dy)||0.01; const m=(minD(a)+minD(b))/2;
    if(dist<m){const p=(m-dist)/2; dx/=dist; dy/=dist; a.x-=dx*p; a.y-=dy*p*aspect; b.x+=dx*p; b.y+=dy*p*aspect;}
  }
  for(const p of pts){const L=p.r.label; const top=L==='elite'||L==='bold', left=L==='elite'||L==='reliable';
    p.x=left?Math.min(47,Math.max(5,p.x)):Math.min(95,Math.max(53,p.x)); p.y=top?Math.min(46,Math.max(7,p.y)):Math.min(93,Math.max(54,p.y));}
  return pts;
}
function coverGrid(r){return `<div class="covers">${r.titles.map(t=>`<div class="cv ${t.delta<0?'dn':''}"><img loading="lazy" src="${cover(t)}"><span class="pb ${t.delta>=0?'up':'down'}">${pushArrows(t.delta)}</span><div class="ct">${esc(t.t)}</div><div class="cs">${why(t)}</div></div>`).join('')}</div>`;}
function rankList(withAv=true){const d=D(); return `<div class="card rlist">${allStudios().map(r=>`${r.wl&&r.idx===d.ranked.length?`<div class="small" style="padding:8px 10px;border-top:1px dashed var(--good)"><b class="up">🌱 Watchlist</b> <span class="fine">· fewer than ${d.gate} titles</span></div>`:''}<div class="it ${st.open===r.idx?'on':''}" data-i="${r.idx}"><span class="rk">${r.rank??'🌱'}</span>${withAv?`<img class="av" src="${cover(best(r))}">`:''}<span class="strong" style="flex:1">${esc(r.name)}</span>${LAB[r.label][0]}<span class="S small">${fmtS(r.S)}</span></div>`).join('')}</div>`;}

/* ===== Round 3: the bubble map, five ways to handle the crowd ===== */
const isPh = () => document.body.classList.contains('phone');
let MAPFULL=false;
const mapW = () => isPh() ? 350 : Math.max(420, Math.min(1100, innerWidth) - 40 - (MAPFULL?0:(st.d===1?398:338)));
const ASP = 0.78;
/* px positions; keep each bubble inside its own label quadrant, push overlaps apart */
function packPx(pts, W, H, gap=4, iters=220){
  const inQ = p => { const L=p.r.label, top=L==='elite'||L==='bold', left=L==='elite'||L==='reliable', m=p.rad+6;
    p.x = left ? Math.min(W/2-m, Math.max(m, p.x)) : Math.min(W-m, Math.max(W/2+m, p.x));
    p.y = top ? Math.min(H/2-m, Math.max(m+36, p.y)) : Math.min(H-m-36, Math.max(H/2+m, p.y)); };
  pts.forEach(inQ);
  for(let it=0; it<iters; it++){
    for(let i=0;i<pts.length;i++) for(let j=i+1;j<pts.length;j++){
      const a=pts[i], b=pts[j]; let dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy)||0.01, m=a.rad+b.rad+gap;
      if(d<m){ const p=(m-d)/2; dx/=d; dy/=d; a.x-=dx*p; a.y-=dy*p; b.x+=dx*p; b.y+=dy*p; }
    }
    pts.forEach(inQ);
  }
  return pts;
}
function planePx(list, W, H, spread=false){
  const d=D(), h0=d.baseHit+0.06, f0=d.baseFlop+0.06;
  const mxH=Math.max(h0+0.1,...list.map(r=>r.hit)), mxF=Math.max(f0+0.1,...list.map(r=>r.flop));
  let fx=f=>f<=f0? f/f0*0.5 : 0.5+(f-f0)/(mxF-f0)*0.5, fy=h=>h<=h0? 1-h/h0*0.5 : 0.5-(h-h0)/(mxH-h0)*0.5;
  if(spread){ // rank-based: spread studios evenly inside each half of each axis
    const rk=(vals,v,lo)=>{const s=vals.filter(x=>lo?x<=v:true).sort((a,b)=>a-b);return s;};
    const lowF=list.filter(r=>r.flop<=f0).map(r=>r.flop).sort((a,b)=>a-b), hiF=list.filter(r=>r.flop>f0).map(r=>r.flop).sort((a,b)=>a-b);
    const lowH=list.filter(r=>r.hit<=h0).map(r=>r.hit).sort((a,b)=>a-b), hiH=list.filter(r=>r.hit>h0).map(r=>r.hit).sort((a,b)=>a-b);
    const pos=(arr,v)=>{const i=arr.indexOf(v), j=arr.lastIndexOf(v); return ((i+j)/2+0.5)/arr.length;};
    fx=f=>f<=f0? pos(lowF,f)*0.5 : 0.5+pos(hiF,f)*0.5; fy=h=>h<=h0? 1-pos(lowH,h)*0.5 : 0.5-pos(hiH,h)*0.5;
  }
  return list.map(r=>({r, x:fx(r.flop)*W, y:fy(r.hit)*H}));
}
const quads = () => {
  const qd=(k,pos,al)=>`<div class="q" style="${pos};background:${{elite:'#7cc6f520',bold:'#f5a46b20',reliable:'#8fd19e20',meh:'#b9b3c925'}[k]};${al||''}">${LAB[k][0]} ${LAB[k][1]}<span>${LAB[k][2]}</span></div>`;
  return qd('elite','left:0;top:0')+qd('bold','right:0;top:0','text-align:right;align-items:flex-end')+qd('reliable','left:0;bottom:0','justify-content:flex-end')+qd('meh','right:0;bottom:0','justify-content:flex-end;align-items:flex-end;text-align:right');
};
function bubble(p, W, H, opts={}){
  const r=p.r, s=p.rad*2, on=opts.on ?? st.open===r.idx;
  const nameTxt = opts.nameText ?? (((r.rank&&r.rank<=5)||on) ? r.name : '');
  return `<div class="bub ${r.wl?'wl':''} ${on?'on':''}" data-i="${r.idx}" title="${esc(r.name)} ${fmtS(r.S)}" style="left:${p.x/W*100}%;top:${p.y/H*100}%;width:${s}px;height:${s}px">
    <img src="${cover(best(r))}"><span class="rb">${r.rank??'🌱'}</span>${nameTxt?`<span class="nmtag">${esc(nameTxt)}</span>`:''}${opts.extra?opts.extra(p):''}</div>`;
}
const mapBox = (W, H, inner) => `<div class="card map" style="aspect-ratio:${W}/${H}">${quads()}${inner}</div>`;

/* Map chosen in round 3: stacks that fan out. A stack whose hidden member is open gets the blue ring and that member's name. */
function stackMap(){
  const W=mapW(), H=W*(MAPFULL&&!isPh()?0.5:ASP), ph=isPh(), all=allStudios();
  const rad=r=>r.wl?(ph?12:16):(ph?12:18)+Math.max(0,r.S)*(ph?12:22);
  const pts=planePx(all,W,H).map(p=>({...p,rad:rad(p.r)})).sort((a,b)=>b.r.S-a.r.S);
  const groups=[];
  for(const p of pts){const g=groups.find(g=>g.r.label===p.r.label&&Math.hypot(g.x-p.x,g.y-p.y)<(g.rad+p.rad)*0.9); if(g) g.members.push(p); else groups.push({...p,members:[p]});}
  packPx(groups,W,H,6);
  const fanOpen = groups.find(g=>g.members.length>1&&g.members.some(m=>m.r.idx===st.fan));
  let html=groups.map(g=>{
    if(g===fanOpen) return '';
    const more=g.members.length-1, openM=g.members.find(m=>m.r.idx===st.open);
    const hiddenOpen = openM && openM!==g.members[0];
    return bubble(g,W,H,{on:!!openM, nameText: hiddenOpen ? `${openM.r.rank?openM.r.rank+'. ':'🌱 '}${openM.r.name}` : undefined,
      extra:()=>more?`<span class="more" data-fan="${g.r.idx}">+${more}</span>`:''});
  }).join('');
  if(fanOpen){ const n=fanOpen.members.length, R=Math.max(fanOpen.rad*2+34, n*(ph?14:20));
    html+=`<div class="fanscrim" data-fan="-1"></div>`+fanOpen.members.map((m,i)=>{const a=-Math.PI/2+i*2*Math.PI/n; let x=fanOpen.x+Math.cos(a)*(i?R:0), y=fanOpen.y+Math.sin(a)*(i?R:0);
      x=Math.min(W-m.rad,Math.max(m.rad,x)); y=Math.min(H-m.rad,Math.max(m.rad,y));
      return bubble({...m,x,y,rad:Math.max(m.rad,ph?16:22)},W,H,{nameText:m.r.name}).replace('class="bub','class="bub fanned');}).join(''); }
  return mapBox(W,H,html+`<div class="maphint">Tap a “+N” to fan out a stack</div>`);
}

/* ---- how a title pushes its studio ----
   loo  = leave-one-out: how much lower/higher S would be without it (compares to this studio's own titles)
   vsAvg = W·(e^z − Ū): above or below YOUR average title (compares to your whole list)        */
const U = () => Math.exp(D().base);
const vsAvg = t => t.W*(Math.exp(t.z)-U());
const avgScore = () => D().mean;
const ttl = t => `<div class="ct">${esc(t.t)}</div>`;
function sTxt(t){ if(t.score!=null) return `${t.score}${t.fav?' ★':''}${t.status==='DROPPED'?' · dropped':''}`; if(t.status==='DROPPED') return 'dropped'+(t.prog?` at ep ${t.prog}`:''); if(t.rep) return 'rewatched'+(t.fav?' ★':''); return t.fav?'★ fav':'—'; }
function head(c){
  const bn=c.titles.find(t=>t.b)?.b||cover(best(c));
  return `<div class="banner" style="background-image:url('${bn}')"></div>
    <div class="dh"><img class="av" style="width:64px;height:64px;border:3px solid var(--fg)" src="${cover(best(c))}"><div><div class="small fine">${c.rank?'#'+c.rank:'🌱 Watchlist'} · ${c.n} titles · ${Math.round(c.hit*100)}% hits · ${Math.round(c.flop*100)}% flops</div><h3>${esc(c.name)}</h3></div><div style="margin-left:auto;text-align:right">${lab(c.label)}<div class="S" style="font-size:20px">${fmtS(c.S)}</div></div></div>`;
}
const card = (c, body) => `<div class="card det">${head(c)}<div class="db">${body}</div></div>`;
const cvTile = (t, badge, dim) => `<div class="cv ${dim?'dn':''}"><img loading="lazy" src="${cover(t)}">${badge}${ttl(t)}<div class="cs">${sTxt(t)}</div></div>`;

/* P1: cover grid, ▲▼ = leave-one-out (what we had) */
function P1(c){
  return card(c, `<div class="small fine" style="margin-bottom:10px">▲ = the score would drop without it · ▼ = the score would rise without it</div><div class="covers">${c.titles.map(t=>cvTile(t,`<span class="pb ${t.delta>=0?'up':'down'}">${pushArrows(t.delta)}</span>`,t.delta<0)).join('')}</div>`);
}
/* P2: shelves by how the title did against YOUR average */
function P2(c){
  const ts=[...c.titles].sort((a,b)=>b.z-a.z);
  const shelf=(name,cls,arr)=>arr.length?`<div class="sec ${cls}">${name} <span class="fine small" style="font-weight:400">${arr.length}</span></div><div class="shelf2">${arr.map(t=>cvTile(t,'',cls==='down')).join('')}</div>`:'';
  const hit=ts.filter(t=>t.z>=1.2), ok=ts.filter(t=>t.z<1.2&&t.z>-1), flop=ts.filter(t=>t.z<=-1);
  return card(c, `<div class="small fine" style="margin-bottom:4px">Your average score is <b>${avgScore().toFixed(1)}</b>. A hit is well above it, a flop well below.</div>
    ${shelf('💖 Hits — pulled it up','up',hit)}${shelf('🙂 Around your usual','',ok)}${shelf('💔 Flops — pulled it down','down',flop)}`);
}
/* P3: one stacked bar, each cover's slice = its share of the score */
function P3(c){
  const ts=[...c.titles].map(t=>({...t,w:t.W*Math.exp(t.z)})), tot=ts.reduce((s,t)=>s+t.w,0)+D().k*U();
  ts.sort((a,b)=>b.w-a.w);
  const pad=D().k*U()/tot;
  return card(c, `<div class="small fine" style="margin-bottom:8px">How much of ${esc(c.name)}’s score each title carries. Big slices = titles you loved; tiny ones barely count.</div>
    <div class="stackbar">${ts.map(t=>`<div class="sl" style="flex:${t.w/tot}" title="${esc(t.t)} ${Math.round(t.w/tot*100)}%"><img src="${cover(t)}"></div>`).join('')}<div class="sl pad" style="flex:${pad}" title="Benefit of the doubt">?</div></div>
    <div class="small fine" style="margin:4px 0 12px">“?” = the benefit of the doubt every studio starts with (${Math.round(pad*100)}%), so a few titles can’t decide it alone.</div>
    <div class="lst">${ts.map(t=>`<div class="lr"><img src="${cover(t)}"><span class="strong grow">${esc(t.t)}</span><span class="fine small">${sTxt(t)}</span><span class="pct" style="--p:${Math.min(100,t.w/tot*100*4)}%">${(t.w/tot*100).toFixed(t.w/tot<0.01?1:0)}%</span></div>`).join('')}</div>`);
}
/* P4: mochi sentence + top 3 / bottom 3, rest folded */
function P4(c){
  const ts=[...c.titles].sort((a,b)=>vsAvg(b)-vsAvg(a)), up=ts.filter(t=>vsAvg(t)>0), dn=ts.filter(t=>vsAvg(t)<0).reverse();
  const say=`${esc(c.name)} is ${c.rank?`your <b>#${c.rank}</b>`:'on your 🌱 watchlist'}. <b>${up.length}</b> of its ${c.n} titles beat your usual, led by <b>${esc(up[0]?.t||'—')}</b>${dn.length?`; <b>${esc(dn[0].t)}</b> let you down the most`:''}.`;
  const row=(arr,cls)=>`<div class="covers c6">${arr.slice(0,3).map(t=>cvTile(t,`<span class="pb ${cls}">${cls==='up'?'▲':'▼'}</span>`,cls==='down')).join('')}</div>`;
  const rest=ts.filter(t=>!up.slice(0,3).includes(t)&&!dn.slice(0,3).includes(t));
  return card(c, `<div class="speech2"><div class="minimochi">• ᴗ •</div><p>${say}</p></div>
    <div class="two"><div><div class="sec up">▲ Lifted it most</div>${row(up,'up')}</div><div><div class="sec down">▼ Held it back most</div>${row(dn,'down')}</div></div>
    <details class="more2" ${st.foldOpen?'open':''} ontoggle="st.foldOpen=this.open"><summary>All ${c.n} titles</summary>${st.fold==='ladder'?`<div style="margin-top:14px">${ladder(c)}</div>`:`<div class="covers" style="margin-top:10px">${rest.map(t=>cvTile(t,`<span class="pb ${vsAvg(t)>=0?'up':'down'}">${vsAvg(t)>=0?'▲':'▼'}</span>`,vsAvg(t)<0)).join('')}</div>`}</details>`);
}
/* ===== Round 6: five prettier ladders (the "All N titles" fold) ===== */
const BANDS=[ // visual only: AniDuel!'s band colours and kaomoji laid over the 10-point line
  {min:9,  name:'Loved', kao:'(♡˙︶˙♡)', col:'var(--band-loved)'},
  {min:7.5,name:'Liked', kao:'(˶ᵔ ᵕ ᵔ˶)', col:'var(--band-liked)'},
  {min:6,  name:'Okay',  kao:'( ・_・)', col:'var(--band-okay)'},
  {min:4,  name:'Meh',   kao:'(´・ω・`)', col:'var(--band-meh)'},
  {min:0,  name:'Hated', kao:'(×﹏×)', col:'var(--band-hated)'}];
const bandOf = s => BANDS.find(b=>s>=b.min);
const tipped = (t, inner, cls='') => `<span class="tp ${cls} ${t.status==='DROPPED'?'drop':''} ${t.fav?'fav':''}" data-tip="${esc(t.t)} · ${sTxt(t)}">${inner}</span>`;
const unscoredRow = c => { const un=c.titles.filter(t=>t.score==null); return un.length?`<div class="unsc"><span class="small fine">No score, still counted:</span>${un.map(t=>tipped(t,`<img src="${cover(t)}">`)).join('')}</div>`:''; };
const scoredOf = c => c.titles.filter(t=>t.score!=null);

/* LD1: bookshelf — covers stand on a shelf per score, your average is a ribbon */
function LD1(c){
  const sc=scoredOf(c), avg=avgScore(), cols={}; sc.forEach(t=>(cols[t.score]=cols[t.score]||[]).push(t));
  const lo=Math.max(1,Math.floor(Math.min(...sc.map(t=>t.score),avg))), steps=[]; for(let v=lo; v<=10; v+=0.5) steps.push(v);
  return `<div class="ld1"><div class="shelfwrap">${steps.map(v=>`<div class="sc ${v<avg?'below':''}">${(cols[v]||[]).map((t,i)=>tipped(t,`<img src="${cover(t)}">`)).join('')}<div class="lbl">${Number.isInteger(v)?v:'·'}</div></div>`).join('')}
    <div class="ribbon" style="left:${(avg-lo+0.25)/(10-lo+0.5)*100}%"><span>your usual ${avg.toFixed(1)}</span></div></div>${unscoredRow(c)}</div>`;
}
/* LD2: fanned card stacks per score */
function LD2(c){
  const sc=scoredOf(c), avg=avgScore(), cols={}; sc.forEach(t=>(cols[t.score]=cols[t.score]||[]).push(t));
  const keys=Object.keys(cols).map(Number).sort((a,b)=>b-a);
  return `<div class="ld2">${keys.map(k=>{const ts=cols[k], b=bandOf(k);
    return `<div class="fan ${k<avg?'below':''}"><div class="cards">${ts.slice(0,5).map((t,i,a)=>{const r=(i-(a.length-1)/2)*7;return tipped(t,`<img src="${cover(t)}">`,'').replace('class="tp','style="transform:rotate('+r+'deg) translateY('+Math.abs(r)/2+'px)" class="tp')}).join('')}</div>
      <div class="sk" style="background:${b.col}">${k}</div><div class="cnt">${ts.length} title${ts.length>1?'s':''}</div></div>`}).join('')}</div>
    <div class="small fine" style="margin-top:4px">Faded stacks are below your usual ${avg.toFixed(1)}.</div>${unscoredRow(c)}`;
}
/* LD3: band rows — Loved / Liked / Okay / Meh / Hated, covers in a strip, your usual as a divider */
function LD3(c){
  const sc=scoredOf(c), avg=avgScore(); let drew=false;
  return `<div class="ld3">${BANDS.map(b=>{const ts=sc.filter(t=>bandOf(t.score)===b).sort((x,y)=>y.score-x.score); if(!ts.length) return '';
    return `<div class="brow"><div class="bp" style="background:${b.col}"><b>${b.kao}</b><span>${b.name}</span><i>${ts.length}</i></div><div class="strip">${ts.map(t=>{let cut=''; if(!drew&&t.score<avg){drew=true;cut=`<span class="cut"><i>your usual ${avg.toFixed(1)}</i></span>`;} return cut+tipped(t,`<img src="${cover(t)}"><em>${t.score}</em>`,t.score<avg?'lo':'');}).join('')}</div></div>`;}).join('')}</div>${unscoredRow(c)}`;
}
/* LD4: beeswarm — round covers swarm along one score line, size = how much the title weighs */
function LD4(c){
  const sc=scoredOf(c), avg=avgScore(), W=isPh()?320:620, H=isPh()?240:220, lo=Math.max(1,Math.floor(Math.min(...sc.map(t=>t.score),avg))-0.5), hi=10.5;
  const x=v=>(v-lo)/(hi-lo)*W, mxW=Math.max(...sc.map(t=>t.W));
  const pts=sc.map(t=>({t,x:x(t.score),y:H/2,r:(isPh()?9:12)+t.W/mxW*(isPh()?8:12)})).sort((a,b)=>b.r-a.r);
  for(let it=0;it<200;it++){for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){const a=pts[i],b=pts[j];let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||0.01,m=a.r+b.r+1;if(d<m){const p=(m-d)/2;dy=dy||((i+j)%2?1:-1)*0.01;d=Math.hypot(dx,dy);a.y-=dy/d*p;b.y+=dy/d*p;a.x-=dx/d*p*0.15;b.x+=dx/d*p*0.15;}}
    pts.forEach(p=>{p.y+=(H/2-p.y)*0.02;p.y=Math.max(p.r,Math.min(H-p.r,p.y));p.x+=(x(p.t.score)-p.x)*0.2;});}
  const ticks=[]; for(let v=Math.ceil(lo); v<=10; v++) ticks.push(v);
  return `<div class="ld4" style="aspect-ratio:${W}/${H+26}"><div class="grad"></div>
    <div class="avg4" style="left:${x(avg)/W*100}%"><span class="mm">• ᴗ •</span><span class="t">your usual ${avg.toFixed(1)}</span></div>
    ${pts.map(p=>tipped(p.t,`<img src="${cover(p.t)}">`,'bee').replace('class="tp',`style="left:${p.x/W*100}%;top:${p.y/(H+26)*100}%;width:${p.r*2}px;height:${p.r*2}px" class="tp`)).join('')}
    ${ticks.map(v=>`<span class="tk" style="left:${x(v)/W*100}%">${v}</span>`).join('')}</div>
    <div class="small fine">Bigger = weighs more (longer show, rewatched). Hover a cover for its name.</div>${unscoredRow(c)}`;
}
/* LD5: pastel histogram — rounded bars, top covers peeking out, mochi on your usual */
function LD5(c){
  const sc=scoredOf(c), avg=avgScore(), cols={}; sc.forEach(t=>(cols[t.score]=cols[t.score]||[]).push(t));
  const lo=Math.max(1,Math.floor(Math.min(...sc.map(t=>t.score),avg))), steps=[]; for(let v=lo; v<=10; v+=0.5) steps.push(v);
  const mx=Math.max(...Object.values(cols).map(a=>a.length));
  return `<div class="ld5"><div class="bars">${steps.map(v=>{const ts=(cols[v]||[]), b=bandOf(v);
      return `<div class="bc"><div class="peek">${ts.slice(0,3).map(t=>tipped(t,`<img src="${cover(t)}">`)).join('')}</div><div class="bar" style="height:${ts.length/mx*100}%;background:${b.col}">${ts.length?`<span>${ts.length}</span>`:''}</div><div class="lbl">${Number.isInteger(v)?v:''}</div></div>`}).join('')}
    <div class="avg5" style="left:${(avg-lo+0.25)/(10-lo+0.5)*100}%"><div class="minimochi s">• ᴗ •</div></div></div>
    <div class="small fine" style="margin-top:6px">The mochi sits on your usual score (${avg.toFixed(1)}). Hover a bar’s covers for names.</div></div>${unscoredRow(c)}`;
}
const LADDERS=[LD1,LD2,LD3,LD4,LD5];
const P5=c=>card(c,ladder(c));
const PANELS=[P1,P2,P3,P4,P5];
const det = () => P4(cur());
/* ===== Round 7: the ranked list, and how the Studio Score reads ===== */
function ladder(c){ return LD4(c); }
const maxS = () => Math.max(...D().ranked.map(r=>r.S));
function scoreView(r, big){
  const f=st.sfmt;
  if(f==='raw') return `<span class="S ${big?'big':''}">${fmtS(r.S)}</span>`;
  if(f==='pts') return `<span class="S ${big?'big':''}">${r.S>=0?'+':'−'}${Math.abs(Math.round(r.S*100))}</span>`;
  if(f==='bar'){ const lo=-0.4, hi=Math.max(0.8,maxS()), z=(0-lo)/(hi-lo)*100, x=(Math.max(lo,Math.min(hi,r.S))-lo)/(hi-lo)*100;
    return `<span class="sbar" title="${fmtS(r.S)}"><i style="${r.S>=0?`left:${z}%;width:${x-z}%`:`left:${x}%;width:${z-x}%`};background:${r.S>=0?'var(--blue)':'var(--danger)'}"></i><b style="left:${z}%"></b></span>`; }
  if(f==='hearts'){ const n=Math.max(0,Math.min(5,Math.round((r.S+0.4)/(maxS()+0.4)*5)));
    return `<span class="hearts" title="${fmtS(r.S)}">${'♥'.repeat(n)}<s>${'♥'.repeat(5-n)}</s></span>`; }
}
const wlHead = d => `<div class="wlh"><b class="up">🌱 Watchlist</b> <span class="fine">· strong, but fewer than ${d.gate} titles</span></div>`;
/* R1: plain rows (now) */
function R1(){ const d=D(); return `<div class="card rlist r1">${allStudios().map(r=>`${r.wl&&r.idx===d.ranked.length?wlHead(d):''}<div class="it ${st.open===r.idx?'on':''}" data-i="${r.idx}"><span class="rk">${r.rank??'🌱'}</span><img class="av" src="${cover(best(r))}"><span class="strong nm">${esc(r.name)}</span>${LAB[r.label][0]}${scoreView(r)}</div>`).join('')}</div>`; }
/* R2: two-line rows — name over label pill and title count */
function R2(){ const d=D(); return `<div class="card rlist r2">${allStudios().map(r=>`${r.wl&&r.idx===d.ranked.length?wlHead(d):''}<div class="it ${st.open===r.idx?'on':''}" data-i="${r.idx}"><span class="rk">${r.rank??'🌱'}</span><img class="av sq" src="${cover(best(r))}"><span class="nm"><b class="strong">${esc(r.name)}</b><span class="sub">${lab(r.label)} <span class="fine small">${r.n} titles</span></span></span>${scoreView(r)}</div>`).join('')}</div>`; }
/* R3: top 3 as banner cards, the rest compact */
function R3(){ const d=D(), all=allStudios();
  const top=all.slice(0,Math.min(3,d.ranked.length)).map(r=>{const bn=r.titles.find(t=>t.b)?.b||cover(best(r));
    return `<div class="tc ${st.open===r.idx?'on':''}" data-i="${r.idx}" style="background-image:linear-gradient(90deg,#000c,#0004),url('${bn}')"><span class="medal">${['🥇','🥈','🥉'][r.rank-1]}</span><span class="nm"><b>${esc(r.name)}</b><span>${LAB[r.label][0]} ${LAB[r.label][1]} · ${r.n} titles</span></span>${scoreView(r,true)}</div>`}).join('');
  return `<div class="r3">${top}<div class="card rlist r1">${all.slice(Math.min(3,d.ranked.length)).map(r=>`${r.wl&&r.idx===d.ranked.length?wlHead(d):''}<div class="it ${st.open===r.idx?'on':''}" data-i="${r.idx}"><span class="rk">${r.rank??'🌱'}</span><img class="av" src="${cover(best(r))}"><span class="strong nm">${esc(r.name)}</span>${LAB[r.label][0]}${scoreView(r)}</div>`).join('')}</div></div>`; }
/* R4: rows with a strip of the studio's top covers */
function R4(){ const d=D(); return `<div class="card rlist r4">${allStudios().map(r=>`${r.wl&&r.idx===d.ranked.length?wlHead(d):''}<div class="it ${st.open===r.idx?'on':''}" data-i="${r.idx}"><span class="rk">${r.rank??'🌱'}</span><span class="nm"><span class="l1"><b class="strong">${esc(r.name)}</b>${LAB[r.label][0]}${scoreView(r)}</span><span class="cvs">${r.titles.slice(0,6).map(t=>`<img src="${cover(t)}">`).join('')}</span></span></div>`).join('')}</div>`; }
/* R5: label-tinted rows, the label colour runs down the left edge */
function R5(){ const d=D(); const col={elite:'var(--elite)',bold:'var(--bold)',reliable:'var(--reliable)',meh:'var(--meh)'};
  return `<div class="card rlist r5">${allStudios().map(r=>`${r.wl&&r.idx===d.ranked.length?wlHead(d):''}<div class="it ${st.open===r.idx?'on':''}" data-i="${r.idx}" style="--lc:${col[r.label]}"><span class="rk">${r.rank??'🌱'}</span><img class="av" src="${cover(best(r))}"><span class="nm"><b class="strong">${esc(r.name)}</b><span class="fine small">${LAB[r.label][1]}</span></span>${scoreView(r)}</div>`).join('')}</div>`; }
const LISTS=[R1,R2,R3,R4,R5];
function L1(){ MAPFULL=false; return `<div class="V1">${hdr()}<div class="wrap">${whoLine()}${notes()}<div class="lay"><div>${stackMap()}${det()}</div>${LISTS[st.d]()}</div></div></div>`; }
const DESIGNS=[
 ['1 · Plain rows','As now: rank, cover, name, label emoji, score. Compact; all 36 fit in little height.',L1],
 ['2 · Two-line rows','Name on top, the full label pill and title count under it. Easier to read labels without the legend.',L1],
 ['3 · Podium cards','Top 3 get banner cards with their best title’s art and a medal; everyone else stays compact.',L1],
 ['4 · Cover strips','Each row shows the studio’s 6 titles that lift it most, so you recognise it by its shows.',L1],
 ['5 · Label edge','A colour edge on each row is its label; the label is spelled out under the name. No emoji to decode.',L1],
];

function render(){
  document.documentElement.dataset.theme=st.theme; document.body.classList.toggle('phone',st.phone);
  const [n,desc,fn]=DESIGNS[st.d]; document.getElementById('app').innerHTML=fn();
  document.getElementById('dname').textContent=`${n}  (${st.d+1}/${DESIGNS.length})`; document.getElementById('ddesc').textContent=desc;
  const g=(id,opts,key,val)=>{document.getElementById(id).innerHTML=opts.map(([v,l])=>`<button class="${val===v?'on':''}" data-k="${key}" data-v="${v}">${l}</button>`).join('')};
  g('gUser',USERS,'user',st.user); g('gWidth',[['desk','🖥 Desktop'],['phone','📱 Phone 390']],'w',st.phone?'phone':'desk'); g('gTheme',[['light','☀ Light'],['dark','☾ Dark']],'t',st.theme); g('gScore',[['raw','+0.70'],['pts','+70'],['bar','▬ bar'],['hearts','♥♥♥']],'sf',st.sfmt); localStorage.p89sf=st.sfmt; 
  localStorage.p89r7d=st.d; localStorage.p89u=st.user; localStorage.p89w=st.phone?'phone':'desk'; localStorage.p89t=st.theme;
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-k]'); if(b){const k=b.dataset.k,v=b.dataset.v; if(k==='user'){st.user=v;st.open=0;st.fan=-1} if(k==='w')st.phone=v==='phone'; if(k==='t')st.theme=v; if(k==='sf')st.sfmt=v; if(k==='fold'){st.fold=v;st.foldOpen=true} render(); return;}
  const tb=e.target.closest('#app [data-tab]'); if(tb){st.tab=tb.dataset.tab; render(); return;}
  if(e.target.closest('#app [data-close]')){st.panel=false; render(); return;}
  const f=e.target.closest('#app [data-fan]'); if(f){st.fan=+f.dataset.fan; render(); return;}
  const r=e.target.closest('#app [data-i]'); if(r){const i=+r.dataset.i; st.panel=!(st.d===2&&isPh()&&st.open===i&&st.panel); if(st.d===2&&isPh()&&!st.panel) st.open=-1; else st.open=i; render(); if(st.d===1||st.d===2) document.querySelector('.det')?.scrollIntoView({block:'nearest'});}
});
document.getElementById('prev').onclick=()=>{st.d=(st.d+DESIGNS.length-1)%DESIGNS.length;render()};
document.getElementById('next').onclick=()=>{st.d=(st.d+1)%DESIGNS.length;render()};
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return; if(e.key==='ArrowLeft')document.getElementById('prev').click(); if(e.key==='ArrowRight')document.getElementById('next').click();});
(()=>{const p=document.getElementById('picker'),g=p.querySelector('.grip');let sx,sy,ox,oy;g.onmousedown=e=>{sx=e.clientX;sy=e.clientY;const r=p.getBoundingClientRect();ox=r.left;oy=r.top;
 const mv=e=>{p.style.left=ox+e.clientX-sx+'px';p.style.top=oy+e.clientY-sy+'px';p.style.right='auto';p.style.bottom='auto'};const up=()=>{removeEventListener('mousemove',mv);removeEventListener('mouseup',up)};addEventListener('mousemove',mv);addEventListener('mouseup',up)}})();
addEventListener('resize',()=>{clearTimeout(window.__rt);window.__rt=setTimeout(render,150)});
render();
</script>
