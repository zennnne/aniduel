<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PROTOTYPE — Top Studios label map (#89, round 2)</title>
<style>
:root{--bg:#edf1f5;--fg:#fafafa;--fg2:#e5ebf1;--tx:#5c728a;--tx-strong:#2b2d42;--blue:#3db4f2;--nav:#2b2d42;--navtx:#bcbedc;--danger:#e05555;--warn:#f2b13d;--good:#3fae5a;--shadow:#0002;
--elite:#7cc6f5;--bold:#f5a46b;--reliable:#8fd19e;--meh:#b9b3c9;--pink:#ffb3c8;
--band-loved:#ffb3c8;--band-liked:#ffe08a;--band-okay:#bfe8c9;--band-meh:#c9d4ff;--band-ink:#4a3b52}
:root[data-theme=dark]{--bg:#0b1622;--fg:#151f2e;--fg2:#1f2a3c;--tx:#9fadbd;--tx-strong:#edf1f5;--nav:#0b1622;--navtx:#9fadbd;--shadow:#0006}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Overpass,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px;background:var(--bg);color:var(--tx);min-height:100vh}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
.strong{color:var(--tx-strong)} .fine{opacity:.7} .small{font-size:12px}
body.phone #stage{display:flex;justify-content:center;padding:24px 0 140px;background:repeating-linear-gradient(45deg,var(--bg),var(--bg) 12px,var(--fg2) 12px,var(--fg2) 24px)}
#app{container-type:inline-size;width:100%;background:var(--bg);min-height:100vh;position:relative}
body.phone #app{width:390px;min-height:760px;border-radius:28px;box-shadow:0 10px 40px var(--shadow);overflow:hidden;border:8px solid var(--nav)}
.hdr{background:var(--nav);color:var(--navtx);padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hdr .logo{font-weight:900;color:#fff;font-size:18px;display:flex;align-items:center;gap:8px}
.hdr .logo b{color:var(--blue)}
.mochi{width:34px;height:26px;background:var(--pink);border-radius:50% 50% 42% 42%/60% 60% 40% 40%;position:relative;flex:none;box-shadow:inset 0 -3px 0 #0001}
.mochi::before{content:'• ᴗ •';position:absolute;inset:0;display:grid;place-items:center;font-size:9px;color:#4a3b52;font-weight:700;letter-spacing:-1px}
.hdr form{display:flex;gap:6px;margin-left:auto}
.hdr input{font:inherit;padding:6px 10px;border-radius:6px;border:none;background:#ffffff1a;color:#fff;width:170px}
.hdr .go{background:var(--blue);color:#fff;border-radius:6px;padding:6px 12px;font-weight:700}
.hdr .back{font-size:12px;color:var(--navtx);text-decoration:underline;cursor:pointer}
@container (max-width:600px){.hdr{padding:10px 12px}.hdr form{margin-left:0;width:100%}.hdr input{flex:1;width:auto}}
.wrap{max-width:1100px;margin:0 auto;padding:20px}
@container (max-width:600px){.wrap{padding:12px}}
.who{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.who h1{font-size:22px;color:var(--tx-strong);font-weight:800}
.note{background:var(--fg);border-left:4px solid var(--warn);padding:8px 12px;border-radius:6px;margin-bottom:8px;font-size:13px}
.card{background:var(--fg);border-radius:10px;box-shadow:0 1px 3px var(--shadow)}
.lab{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:700;color:#2b2d42;white-space:nowrap}
.lab.elite{background:var(--elite)}.lab.bold{background:var(--bold)}.lab.reliable{background:var(--reliable)}.lab.meh{background:var(--meh)}
.S{font-variant-numeric:tabular-nums;font-weight:800;color:var(--tx-strong)}
.up{color:var(--good)} .down{color:var(--danger)}
img{display:block}

#picker{position:fixed;right:18px;bottom:18px;z-index:99;background:#1b1d2e;color:#eee;border-radius:12px;padding:10px 12px;box-shadow:0 8px 30px #0008;font-size:12px;width:310px;user-select:none}
#picker .grip{cursor:move;font-size:10px;opacity:.6;text-align:center;margin:-4px 0 4px}
#picker .nm{display:flex;align-items:center;gap:8px}
#picker .nm b{flex:1;text-align:center;font-size:14px}
#picker .nm button{background:#ffffff1a;border-radius:6px;padding:4px 10px;font-size:14px}
#picker .desc{opacity:.75;margin:6px 0 8px;text-align:center;line-height:1.35}
#picker .grp{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
#picker .grp button{background:#ffffff14;border-radius:5px;padding:3px 7px}
#picker .grp button.on{background:var(--blue);color:#fff}
#picker .k{opacity:.5;width:100%;margin-top:4px}

/* shared map bits */
.map{position:relative;border-radius:16px;overflow:hidden}
.map .pin{position:absolute;transform:translate(-50%,-50%);cursor:pointer;transition:transform .15s}
.map .pin:hover{transform:translate(-50%,-50%) scale(1.12);z-index:9}
.lay{display:grid;grid-template-columns:1fr 320px;gap:18px;align-items:start}
.lay>div{min-width:0}
@container (max-width:760px){.lay{grid-template-columns:1fr}}
.rlist .it{display:flex;gap:10px;padding:7px 10px;cursor:pointer;align-items:center;border-top:1px solid var(--fg2)}
.rlist .it:first-child{border-top:none}
.rlist .it.on{background:var(--fg2)}
.rlist .rk{width:20px;font-weight:800;text-align:right;color:var(--tx-strong)}
.av{width:30px;height:30px;border-radius:50%;object-fit:cover;flex:none;background:var(--fg2)}
.covers{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:12px}
.cv{position:relative}
.cv img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:8px;box-shadow:0 2px 6px var(--shadow)}
.cv .pb{position:absolute;top:6px;right:6px;font-size:11px;font-weight:800;padding:1px 6px;border-radius:99px;background:#fff;box-shadow:0 1px 3px #0004}
.cv .ct{font-size:11px;margin-top:4px;line-height:1.25;color:var(--tx-strong);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cv .cs{font-size:11px;opacity:.75}
.cv.dn img{filter:grayscale(.7) brightness(.9)}
.sec{font-size:13px;font-weight:800;color:var(--tx-strong);margin:14px 0 8px}

/* ===== 1: Cover bubbles ===== */
.V1 .map{aspect-ratio:1/.78;background:var(--fg)}
.V1 .q{position:absolute;width:50%;height:50%;display:flex;flex-direction:column;padding:14px 16px;font-weight:800;font-size:13px;color:var(--tx-strong)}
.V1 .q .big{font-size:64px;opacity:.13;position:absolute;filter:grayscale(.2)}
.V1 .q span{font-weight:400;font-size:11px;opacity:.75}
.V1 .bub{border-radius:50%;border:3px solid #fff;box-shadow:0 3px 10px #0003;overflow:visible;position:absolute;transform:translate(-50%,-50%);cursor:pointer;transition:transform .15s}
.V1 .bub img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.V1 .bub:hover{transform:translate(-50%,-50%) scale(1.15);z-index:9}
.V1 .bub .rb{position:absolute;bottom:-6px;right:-6px;background:var(--tx-strong);color:var(--fg);font-size:10px;font-weight:800;border-radius:99px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px;border:2px solid var(--fg)}
.V1 .bub .nmtag{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:6px;font-size:10px;font-weight:700;white-space:nowrap;color:var(--tx-strong);background:var(--fg);padding:0 5px;border-radius:4px;opacity:.95}
.V1 .bub.on{border-color:var(--blue);box-shadow:0 0 0 5px #3db4f266;z-index:8}
.V1 .bub.wl{border:3px dashed var(--good)}
.V1 .det{padding:0;overflow:hidden;margin-top:16px}
.V1 .banner{height:110px;background-size:cover;background-position:center;position:relative}
.V1 .banner::after{content:'';position:absolute;inset:0;background:linear-gradient(transparent,var(--fg))}
.V1 .dh{padding:0 18px;margin-top:-34px;position:relative;z-index:1;display:flex;gap:12px;align-items:flex-end}
.V1 .dh h3{font-size:22px;color:var(--tx-strong)}
.V1 .db{padding:12px 18px 18px}

/* ===== 2: Night sky ===== */
.V2{--sky:#0a1020}
.V2 .wrap{max-width:none;padding:0}
.V2 .skywrap{background:radial-gradient(ellipse at 30% 20%,#1d2b55 0%,#0a1020 60%);color:#cfd8ee;padding:20px}
.V2 .skywrap h1{color:#fff}
.V2 .map{aspect-ratio:1/.62;max-width:1060px;margin:0 auto;background-image:radial-gradient(1px 1px at 10% 20%,#fff8,transparent),radial-gradient(1px 1px at 70% 30%,#fff6,transparent),radial-gradient(1.5px 1.5px at 40% 80%,#fff7,transparent),radial-gradient(1px 1px at 85% 65%,#fff5,transparent),radial-gradient(1px 1px at 25% 55%,#fff6,transparent),radial-gradient(1px 1px at 55% 12%,#fff6,transparent)}
.V2 .ql{position:absolute;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#ffffff55;font-weight:700}
.V2 .ql span{display:block;letter-spacing:0;text-transform:none;font-weight:400;font-size:11px;color:#ffffff40}
.V2 .cross{position:absolute;background:#ffffff14}
.V2 .star{position:absolute;transform:translate(-50%,-50%);cursor:pointer;display:flex;align-items:center;gap:6px}
.V2 .star i{display:block;border-radius:50%;background:#fff;box-shadow:0 0 12px 4px var(--g),0 0 30px 8px var(--g)}
.V2 .star b{font-size:11px;color:#e8eeff;white-space:nowrap;text-shadow:0 1px 4px #000}
.V2 .star.on i{box-shadow:0 0 0 3px #fff,0 0 18px 8px var(--g),0 0 50px 16px var(--g)}
.V2 .star.wl i{background:transparent;border:1.5px dashed #9be7a9;box-shadow:none}
.V2 .glass{background:#ffffff10;border:1px solid #ffffff1f;backdrop-filter:blur(8px);border-radius:14px;padding:16px;color:#cfd8ee}
.V2 .glass .strong,.V2 .glass .S{color:#fff}
.V2 .lower{max-width:1060px;margin:16px auto 0;display:grid;grid-template-columns:1fr 300px;gap:16px}
@container (max-width:760px){.V2 .lower{grid-template-columns:1fr}.V2 .star b{display:none}.V2 .star.on b,.V2 .star.top b{display:block}.V2 .map{aspect-ratio:1/1}}
.V2 .rlist .it{border-color:#ffffff14}.V2 .rlist .it.on{background:#ffffff18}.V2 .rlist .rk{color:#fff}
.V2 .note{background:#ffffff10;color:#e8eeff}

/* ===== 3: Four rooms ===== */
.V3 .rooms{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@container (max-width:640px){.V3 .rooms{grid-template-columns:1fr}}
.V3 .room{border-radius:16px;padding:14px;position:relative;min-height:160px}
.V3 .room.elite{background:linear-gradient(135deg,#7cc6f533,#7cc6f511)}.V3 .room.bold{background:linear-gradient(135deg,#f5a46b33,#f5a46b11)}
.V3 .room.reliable{background:linear-gradient(135deg,#8fd19e33,#8fd19e11)}.V3 .room.meh{background:linear-gradient(135deg,#b9b3c944,#b9b3c911)}
.V3 .rh{display:flex;align-items:baseline;gap:8px;margin-bottom:2px}
.V3 .rh b{font-size:17px;color:var(--tx-strong)}
.V3 .rd{font-size:12px;opacity:.8;margin-bottom:10px}
.V3 .chips{display:flex;flex-wrap:wrap;gap:8px}
.V3 .chip{display:flex;align-items:center;gap:8px;background:var(--fg);border-radius:12px;padding:6px 10px 6px 6px;cursor:pointer;box-shadow:0 1px 3px var(--shadow);transition:transform .12s}
.V3 .chip:hover{transform:translateY(-2px)}
.V3 .chip.on{outline:3px solid var(--blue)}
.V3 .stack{display:flex}
.V3 .stack img{width:26px;height:38px;object-fit:cover;border-radius:4px;border:2px solid var(--fg);margin-left:-10px;box-shadow:0 1px 3px #0003}
.V3 .stack img:first-child{margin-left:0}
.V3 .chip .rk{font-weight:900;color:var(--tx-strong);font-size:12px}
.V3 .chip .n{font-weight:700;color:var(--tx-strong);font-size:13px}
.V3 .chip.big .stack img{width:36px;height:52px}
.V3 .chip.big .n{font-size:15px}
.V3 .det{padding:16px;margin-top:14px}
.V3 .axis{display:flex;justify-content:space-between;font-size:11px;opacity:.6;margin:6px 4px}

/* ===== 4: Polished map + cover list ===== */
.V4 .map{aspect-ratio:1/.8;background:var(--fg);box-shadow:0 1px 3px var(--shadow)}
.V4 .grid{position:absolute;inset:0;background-image:linear-gradient(var(--fg2) 1px,transparent 1px),linear-gradient(90deg,var(--fg2) 1px,transparent 1px);background-size:10% 12.5%;opacity:.7}
.V4 .qq{position:absolute;width:50%;height:50%}
.V4 .ql{position:absolute;font-size:12px;font-weight:800;padding:4px 10px;border-radius:99px;color:#2b2d42;z-index:2}
.V4 .dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff;border:2px solid var(--fg);box-shadow:0 2px 6px #0003}
.V4 .dot.on{outline:3px solid var(--blue);outline-offset:2px;z-index:8}
.V4 .dot.wl{background:var(--fg)!important;color:var(--good);border:2px dashed var(--good)}
.V4 .ax{position:absolute;font-size:10px;opacity:.7}
.V4 .shelf{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 10px;scroll-snap-type:x mandatory}
.V4 .shelf .cv{min-width:96px;max-width:96px;scroll-snap-align:start}
.V4 .det{padding:16px;margin-top:16px}

/* ===== 5: Mochi map ===== */
.V5 .map{aspect-ratio:1/.75}
.V5 .q{position:absolute;width:50%;height:50%;padding:12px 14px}
.V5 .q.elite{background:var(--band-loved)}.V5 .q.bold{background:var(--band-liked)}.V5 .q.reliable{background:var(--band-okay)}.V5 .q.meh{background:var(--band-meh)}
.V5 .q{z-index:0}.V5 .q .kao{font-size:15px;font-weight:700;color:var(--band-ink)}
.V5 .q .kn{font-size:13px;font-weight:900;color:var(--band-ink)}
.V5 .q .kd{font-size:11px;color:var(--band-ink);opacity:.75}
.V5 .pin.stk{transform:translate(0,-50%)}.V5 .pin.stk:hover{transform:translate(0,-50%) scale(1.08)}
.V5 .stk{display:flex;align-items:center;gap:5px;background:#fff;border-radius:99px;padding:3px 9px 3px 3px;box-shadow:0 2px 0 #0002;font-size:11px;font-weight:800;color:#4a3b52;white-space:nowrap;border:2px solid #fff}
.V5 .stk img{width:22px;height:22px;border-radius:50%;object-fit:cover}
.V5 .stk.on{border-color:#4a3b52;z-index:8}
.V5 .stk.wl{border:2px dashed var(--good)}
.V5 .speech{display:flex;gap:14px;align-items:flex-start;margin-top:16px}
.V5 .bigmochi{width:74px;height:56px;background:var(--pink);border-radius:50% 50% 42% 42%/60% 60% 40% 40%;flex:none;display:grid;place-items:center;font-size:13px;font-weight:700;color:#4a3b52;box-shadow:inset 0 -5px 0 #0001}
.V5 .bubble{background:var(--fg);border-radius:16px;padding:14px 16px;position:relative;flex:1;box-shadow:0 1px 3px var(--shadow)}
.V5 .bubble::before{content:'';position:absolute;left:-8px;top:18px;border:8px solid transparent;border-right-color:var(--fg);border-left:0}
.V5 .bubble p{color:var(--tx-strong);font-size:14px;line-height:1.5}
@container (max-width:600px){.V5 .stk span{display:none}.V5 .stk{padding:3px}.V5 .stk.on span{display:inline}.V5 .q .kd{display:none}.V5 .map{aspect-ratio:1/1}}
</style>
</head>
<body>
<div id="stage"><div id="app"></div></div>
<div id="picker">
  <div class="grip">⠿ drag ⠿</div>
  <div class="nm"><button id="prev">←</button><b id="dname"></b><button id="next">→</button></div>
  <div class="desc" id="ddesc"></div>
  <div class="grp" id="gUser"></div>
  <div class="grp" id="gWidth"></div>
  <div class="grp" id="gTheme"></div>
  <div class="k">← / → switch design · click a studio to open it</div>
</div>
<script>
const DATA = /*DATA*/;
const USERS = [['zennnne','zennnne (normal)'],['ManMode','ManMode (scored < 50%)'],['Keennaja','Keennaja (gate lowered)']];
const LAB = {elite:['💎','Elite','Lots of hits, few flops','(♡˙︶˙♡)'],bold:['🎲','Bold','Lots of hits, and lots of flops too','(๑•̀ㅂ•́)و✧'],reliable:['🛡️','Reliable','Few hits, few flops','( ・_・)'],meh:['💤','Meh','Few hits, lots of flops','(´・ω・`)']};
const st = {d:+(localStorage.p89r2d||0), user:localStorage.p89u||'zennnne', phone:localStorage.p89w==='phone', theme:localStorage.p89t||'light', open:0};
const D = () => DATA[st.user];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtS = s => (s>=0?'+':'−') + Math.abs(s).toFixed(2);
const lab = l => `<span class="lab ${l}">${LAB[l][0]} ${LAB[l][1]}</span>`;
const allStudios = () => [...D().ranked.map((r,i)=>({...r,rank:i+1,idx:i})), ...D().watch.map((r,j)=>({...r,rank:null,wl:true,idx:D().ranked.length+j}))];
const cur = () => allStudios()[st.open] || allStudios()[0];
const best = r => r.titles[0]; // titles sorted by push, biggest lift first
const cover = t => t && t.c ? t.c : '';
function why(t){const b=[]; if(t.score!=null) b.push(`you scored ${t.score}`); else if(t.status==='DROPPED') b.push('dropped, no score'); else if(t.rep) b.push('rewatched, no score'); else b.push('no score');
  if(t.fav) b.push('★'); if(t.status==='DROPPED'&&t.score!=null) b.push('dropped'); return b.join(' · ');}
function pushArrows(d){const a=Math.abs(d); const n=a>=0.05?3:a>=0.015?2:1; return (d>=0?'▲':'▼').repeat(n);}
function notes(){const d=D(), o=[];
  if(d.gate<6) o.push(`<div class="note">You have a short list, so a studio needed only <b>${d.gate} titles</b> (not 6) to be ranked.${d.rankedCount<10?` Only ${d.rankedCount} studios made it.`:''}</div>`);
  if(d.countedScoredFrac<0.5) o.push(`<div class="note">You scored only <b>${Math.round(d.countedScoredFrac*100)}%</b> of the titles that counted, so the labels may be off.</div>`);
  return o.join('');}
const hdr = () => `<div class="hdr"><div class="logo"><span class="mochi"></span>Top <b>Studios</b></div><span class="back">← AniDuel!</span>
  <form onsubmit="return false"><input value="${esc(st.user)}" placeholder="AniList username"><button class="go">Show</button></form></div>`;
const whoLine = () => `<div class="who"><h1>${esc(st.user)}’s top studios</h1><span class="fine small">${D().entries} titles watched · ${D().rankedCount} studios ranked</span></div>`;

/* position on the hit × flop plane: the label line sits in the middle of each axis */
function plane(maxN){
  const d=D(), h0=d.baseHit+0.06, f0=d.baseFlop+0.06, all=allStudios();
  const shown = all.filter(r=>r.wl || r.rank<=maxN);
  const mxH=Math.max(h0+0.1,...shown.map(r=>r.hit)), mxF=Math.max(f0+0.1,...shown.map(r=>r.flop));
  const px=f=>f<=f0? 4+f/f0*46 : 50+(f-f0)/(mxF-f0)*46, py=h=>h<=h0? 96-h/h0*46 : 50-(h-h0)/(mxH-h0)*46;
  return shown.map(r=>({r, x:px(r.flop), y:py(r.hit)}));
}
/* nudge apart overlapping pins; keep each pin inside its own quadrant */
function relax(pts, minD, aspect){
  for(let it=0;it<120;it++) for(let i=0;i<pts.length;i++) for(let j=i+1;j<pts.length;j++){
    const a=pts[i],b=pts[j]; let dx=(b.x-a.x), dy=(b.y-a.y)/aspect; let dist=Math.hypot(dx,dy)||0.01; const m=(minD(a)+minD(b))/2;
    if(dist<m){const p=(m-dist)/2; dx/=dist; dy/=dist; a.x-=dx*p; a.y-=dy*p*aspect; b.x+=dx*p; b.y+=dy*p*aspect;}
  }
  for(const p of pts){const L=p.r.label; const top=L==='elite'||L==='bold', left=L==='elite'||L==='reliable';
    p.x=left?Math.min(47,Math.max(5,p.x)):Math.min(95,Math.max(53,p.x)); p.y=top?Math.min(46,Math.max(7,p.y)):Math.min(93,Math.max(54,p.y));}
  return pts;
}
function coverGrid(r){return `<div class="covers">${r.titles.map(t=>`<div class="cv ${t.delta<0?'dn':''}"><img loading="lazy" src="${cover(t)}"><span class="pb ${t.delta>=0?'up':'down'}">${pushArrows(t.delta)}</span><div class="ct">${esc(t.t)}</div><div class="cs">${why(t)}</div></div>`).join('')}</div>`;}
function rankList(withAv=true){const d=D(); return `<div class="card rlist">${allStudios().map(r=>`${r.wl&&r.idx===d.ranked.length?`<div class="small" style="padding:8px 10px;border-top:1px dashed var(--good)"><b class="up">🌱 Watchlist</b> <span class="fine">· fewer than ${d.gate} titles</span></div>`:''}<div class="it ${st.open===r.idx?'on':''}" data-i="${r.idx}"><span class="rk">${r.rank??'🌱'}</span>${withAv?`<img class="av" src="${cover(best(r))}">`:''}<span class="strong" style="flex:1">${esc(r.name)}</span>${LAB[r.label][0]}<span class="S small">${fmtS(r.S)}</span></div>`).join('')}</div>`;}

/* ---------- 1 ---------- */
function V1(){
  const ph=document.body.classList.contains('phone'), N=ph?12:20, asp=1/0.78;
  const size=r=>r.wl?30:Math.round(30+Math.max(0,r.S)*40*(ph?.7:1));
  const pts=relax(plane(N), p=>size(p.r)/ (ph?3.6:9.2)+1.2, asp);
  const c=cur(), bn=c.titles.find(t=>t.b)?.b||cover(best(c));
  const qd=(k,pos,emo,al)=>`<div class="q" style="${pos};background:${{elite:'#7cc6f520',bold:'#f5a46b20',reliable:'#8fd19e20',meh:'#b9b3c925'}[k]};${al}">${LAB[k][0]} ${LAB[k][1]}<span>${LAB[k][2]}</span></div>`;
  return `<div class="V1">${hdr()}<div class="wrap">${whoLine()}${notes()}<div class="lay"><div>
   <div class="card map">${qd('elite','left:0;top:0')}${qd('bold','right:0;top:0','','text-align:right;align-items:flex-end')}${qd('reliable','left:0;bottom:0','','justify-content:flex-end')}${qd('meh','right:0;bottom:0','','justify-content:flex-end;align-items:flex-end;text-align:right')}
    ${pts.map(p=>{const s=size(p.r);return `<div class="bub ${p.r.wl?'wl':''} ${st.open===p.r.idx?'on':''}" data-i="${p.r.idx}" title="${esc(p.r.name)}" style="left:${p.x}%;top:${p.y}%;width:${s}px;height:${s}px"><img src="${cover(best(p.r))}"><span class="rb">${p.r.rank??'🌱'}</span>${(p.r.rank&&p.r.rank<=5)||st.open===p.r.idx?`<span class="nmtag">${esc(p.r.name)}</span>`:''}</div>`}).join('')}
   </div>
   <div class="card det"><div class="banner" style="background-image:url('${bn}')"></div>
    <div class="dh"><img class="av" style="width:64px;height:64px;border:3px solid var(--fg)" src="${cover(best(c))}"><div><div class="small fine">${c.rank?'#'+c.rank:'🌱 Watchlist'} · ${c.n} titles · ${Math.round(c.hit*100)}% hits · ${Math.round(c.flop*100)}% flops</div><h3>${esc(c.name)}</h3></div><div style="margin-left:auto;text-align:right">${lab(c.label)}<div class="S" style="font-size:20px">${fmtS(c.S)}</div></div></div>
    <div class="db">${coverGrid(c)}</div></div>
  </div>${rankList()}</div></div></div>`;
}

/* ---------- 2 ---------- */
function V2(){
  const ph=document.body.classList.contains('phone'), N=ph?12:20;
  const pts=relax(plane(N), p=>ph?7:4.5, 1/0.62), c=cur();
  return `<div class="V2">${hdr()}<div class="wrap"><div class="skywrap">
   <div style="max-width:1060px;margin:0 auto">${whoLine()}${notes()}</div>
   <div class="map">
    <div class="cross" style="left:50%;top:4%;bottom:4%;width:1px"></div><div class="cross" style="top:50%;left:2%;right:2%;height:1px"></div>
    <div class="ql" style="left:2%;top:3%">💎 Elite<span>${LAB.elite[2]}</span></div><div class="ql" style="right:2%;top:3%;text-align:right">🎲 Bold<span>${LAB.bold[2]}</span></div>
    <div class="ql" style="left:2%;bottom:3%">🛡️ Reliable<span>${LAB.reliable[2]}</span></div><div class="ql" style="right:2%;bottom:3%;text-align:right">💤 Meh<span>${LAB.meh[2]}</span></div>
    ${pts.map(p=>{const s=p.r.wl?9:Math.max(4,5+p.r.S*12), col=best(p.r).col||'#8ab4ff';return `<div class="star ${p.r.wl?'wl':''} ${st.open===p.r.idx?'on':''} ${p.r.rank&&p.r.rank<=3?'top':''}" data-i="${p.r.idx}" style="left:${p.x}%;top:${p.y}%;--g:${col}aa"><i style="width:${s}px;height:${s}px"></i><b>${p.r.rank?p.r.rank+'. ':'🌱 '}${esc(p.r.name)}</b></div>`}).join('')}
   </div>
   <div class="lower"><div class="glass">
     <div class="small" style="opacity:.7">${c.rank?'#'+c.rank:'🌱 Watchlist'} · ${c.n} titles · ${Math.round(c.hit*100)}% hits · ${Math.round(c.flop*100)}% flops</div>
     <div style="display:flex;gap:10px;align-items:center;margin:4px 0 12px"><b class="strong" style="font-size:22px">${esc(c.name)}</b>${lab(c.label)}<span class="S" style="margin-left:auto;font-size:20px">${fmtS(c.S)}</span></div>
     ${coverGrid(c).replaceAll('class="ct"','class="ct" style="color:#fff"')}
   </div><div class="glass" style="padding:0">${rankList(false)}</div></div>
  </div></div></div>`;
}

/* ---------- 3 ---------- */
function V3(){
  const all=allStudios(), c=cur();
  const room=k=>{const rs=all.filter(r=>r.label===k); return `<div class="room ${k}"><div class="rh"><b>${LAB[k][0]} ${LAB[k][1]}</b><span class="small fine">${rs.length}</span></div><div class="rd">${LAB[k][2]}</div>
    <div class="chips">${rs.map(r=>`<div class="chip ${r.rank&&r.rank<=3?'big':''} ${st.open===r.idx?'on':''}" data-i="${r.idx}" ${r.wl?'style="border:2px dashed var(--good)"':''}><div class="stack">${r.titles.slice(0,3).map(t=>`<img src="${cover(t)}">`).join('')}</div><span class="rk">${r.rank?'#'+r.rank:'🌱'}</span><span class="n">${esc(r.name)}</span><span class="S small">${fmtS(r.S)}</span></div>`).join('')||'<span class="small fine">none</span>'}</div></div>`;};
  return `<div class="V3">${hdr()}<div class="wrap">${whoLine()}${notes()}
   <div class="axis"><span>← fewer flops</span><span>more flops →</span></div>
   <div class="rooms">${room('elite')}${room('bold')}${room('reliable')}${room('meh')}</div>
   <div class="small fine" style="margin-top:6px">🌱 dashed = Watchlist: strong, but fewer than ${D().gate} titles so far · Inside each box, ranked by Studio Score.</div>
   <div class="card det"><div style="display:flex;gap:12px;align-items:center;margin-bottom:6px"><b class="strong" style="font-size:20px">${c.rank?'#'+c.rank+' ':'🌱 '}${esc(c.name)}</b>${lab(c.label)}<span class="S" style="margin-left:auto;font-size:20px">${fmtS(c.S)}</span></div>
    <div class="small fine" style="margin-bottom:10px">${c.n} titles · ${Math.round(c.hit*100)}% hits · ${Math.round(c.flop*100)}% flops</div>${coverGrid(c)}</div>
  </div></div>`;
}

/* ---------- 4 ---------- */
function V4(){
  const ph=document.body.classList.contains('phone'), N=ph?15:36;
  const pts=relax(plane(N), p=>ph?7.5:3.6, 1/0.8), c=cur();
  const col={elite:'#3a9fe0',bold:'#e9813a',reliable:'#3fae5a',meh:'#8a82a3'};
  const lift=c.titles.filter(t=>t.delta>=0.005), drag=c.titles.filter(t=>t.delta<=-0.005).reverse();
  const shelf=ts=>`<div class="shelf">${ts.map(t=>`<div class="cv ${t.delta<0?'dn':''}"><img loading="lazy" src="${cover(t)}"><span class="pb ${t.delta>=0?'up':'down'}">${pushArrows(t.delta)}</span><div class="ct">${esc(t.t)}</div><div class="cs">${why(t)}</div></div>`).join('')||'<span class="small fine">nothing</span>'}</div>`;
  return `<div class="V4">${hdr()}<div class="wrap">${whoLine()}${notes()}<div class="lay"><div>
   <div class="map"><div class="qq" style="left:0;top:0;background:#7cc6f51c"></div><div class="qq" style="right:0;top:0;background:#f5a46b1c"></div><div class="qq" style="left:0;bottom:0;background:#8fd19e1c"></div><div class="qq" style="right:0;bottom:0;background:#b9b3c922"></div>
    <div class="grid"></div>
    <div style="position:absolute;left:50%;top:0;bottom:0;border-left:2px dashed var(--fg2)"></div><div style="position:absolute;top:50%;left:0;right:0;border-top:2px dashed var(--fg2)"></div>
    <span class="ql lab elite" style="left:10px;top:10px">💎 Elite</span><span class="ql lab bold" style="right:10px;top:10px">🎲 Bold</span><span class="ql lab reliable" style="left:10px;bottom:10px">🛡️ Reliable</span><span class="ql lab meh" style="right:10px;bottom:10px">💤 Meh</span>
    <span class="ax" style="left:50%;bottom:10px;transform:translateX(-50%)">more flops →</span><span class="ax" style="left:10px;top:50%;transform:translateY(-50%)">↑ more hits</span>
    ${pts.map(p=>`<div class="pin dot ${p.r.wl?'wl':''} ${st.open===p.r.idx?'on':''}" data-i="${p.r.idx}" title="${esc(p.r.name)}" style="left:${p.x}%;top:${p.y}%;background:${col[p.r.label]}">${p.r.rank??'🌱'}</div>`).join('')}
   </div>
   <div class="card det"><div style="display:flex;gap:12px;align-items:center"><img class="av" style="width:44px;height:44px" src="${cover(best(c))}"><div><div class="small fine">${c.rank?'#'+c.rank:'🌱 Watchlist'} · ${c.n} titles · ${Math.round(c.hit*100)}% hits · ${Math.round(c.flop*100)}% flops</div><b class="strong" style="font-size:20px">${esc(c.name)}</b></div><div style="margin-left:auto;text-align:right">${lab(c.label)}<div class="S" style="font-size:18px">${fmtS(c.S)}</div></div></div>
    <div class="sec up">▲ Lifted it</div>${shelf(lift)}<div class="sec down">▼ Held it back</div>${shelf(drag)}
   </div></div>${rankList()}</div></div></div>`;
}

/* ---------- 5 ---------- */
function V5(){
  const ph=document.body.classList.contains('phone'), N=ph?10:16;
  const pts=relax(plane(N).map(p=>({...p,x:p.x<50?p.x*0.6:50+(p.x-50)*0.6})), p=>ph?7:(p.r.name.length*0.45+4), 1/0.75/3).map(p=>({...p,x:p.x<50?Math.min(30,Math.max(2,p.x)):Math.min(ph?82:76,Math.max(51,p.x))})), c=cur();
  const top=c.titles[0], low=[...c.titles].reverse().find(t=>t.delta<0);
  const say=`<b>${esc(c.name)}</b> is ${c.rank?`your <b>#${c.rank}</b>`:'on your 🌱 watchlist'}, ${{elite:'an Elite: lots of hits and hardly any flops',bold:'a Bold one: big hits, but some flops too',reliable:'a Reliable one: safe picks, not many big hits',meh:'a Meh one: few hits and some flops'}[c.label]}. <b>${esc(top.t)}</b> lifts it the most${low?`, and <b>${esc(low.t)}</b> holds it back the most`:''}.`;
  const qd=(k,pos,al='')=>`<div class="q ${k}" style="${pos};${al}"><div class="kao">${LAB[k][3]}</div><div class="kn">${LAB[k][1]}</div><div class="kd">${LAB[k][2]}</div></div>`;
  return `<div class="V5">${hdr()}<div class="wrap">${whoLine()}${notes()}<div class="lay"><div>
   <div class="map">${qd('elite','left:0;top:0')}${qd('bold','right:0;top:0','text-align:right')}${qd('reliable','left:0;bottom:0','display:flex;flex-direction:column;justify-content:flex-end')}${qd('meh','right:0;bottom:0','display:flex;flex-direction:column;justify-content:flex-end;text-align:right')}
    ${pts.map(p=>`<div class="pin stk ${p.r.wl?'wl':''} ${st.open===p.r.idx?'on':''}" data-i="${p.r.idx}" title="${esc(p.r.name)}" style="left:${p.x}%;top:${p.y}%"><img src="${cover(best(p.r))}"><span>${p.r.rank?p.r.rank+'. ':'🌱 '}${esc(p.r.name)}</span></div>`).join('')}
   </div>
   <div class="speech"><div class="bigmochi">• ᴗ •</div><div class="bubble"><p>${say}</p><div class="small fine" style="margin:6px 0 12px">${c.n} titles · ${Math.round(c.hit*100)}% hits · ${Math.round(c.flop*100)}% flops · Studio Score ${fmtS(c.S)}</div>${coverGrid(c)}</div></div>
  </div>${rankList()}</div></div></div>`;
}

const DESIGNS=[
 ['1 · Cover bubbles','Each studio is a round cover of the title that lifts it most, sized by score. The open studio gets a banner and a cover grid.',V1],
 ['2 · Night sky','Studios are stars glowing in their top title’s colour, bigger = higher score. Glass panels below.',V2],
 ['3 · Four rooms','No scatter: four label boxes, each studio a chip with 3 stacked covers, ranked inside its box. Nothing overlaps.',V3],
 ['4 · Clean map + shelves','The current map, polished: coloured numbered dots, a list with covers, and the open studio split into “lifted it / held it back” shelves.',V4],
 ['5 · Mochi map','AniDuel!’s pastel band colours and kaomoji as the four corners, studios as stickers, and the mochi explains the open studio in a sentence.',V5],
];
function render(){
  document.documentElement.dataset.theme=st.theme; document.body.classList.toggle('phone',st.phone);
  const [n,desc,fn]=DESIGNS[st.d]; document.getElementById('app').innerHTML=fn();
  document.getElementById('dname').textContent=`${n}  (${st.d+1}/${DESIGNS.length})`; document.getElementById('ddesc').textContent=desc;
  const g=(id,opts,key,val)=>{document.getElementById(id).innerHTML=opts.map(([v,l])=>`<button class="${val===v?'on':''}" data-k="${key}" data-v="${v}">${l}</button>`).join('')};
  g('gUser',USERS,'user',st.user); g('gWidth',[['desk','🖥 Desktop'],['phone','📱 Phone 390']],'w',st.phone?'phone':'desk'); g('gTheme',[['light','☀ Light'],['dark','☾ Dark']],'t',st.theme);
  localStorage.p89r2d=st.d; localStorage.p89u=st.user; localStorage.p89w=st.phone?'phone':'desk'; localStorage.p89t=st.theme;
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-k]'); if(b){const k=b.dataset.k,v=b.dataset.v; if(k==='user'){st.user=v;st.open=0} if(k==='w')st.phone=v==='phone'; if(k==='t')st.theme=v; render(); return;}
  const r=e.target.closest('#app [data-i]'); if(r){st.open=+r.dataset.i; render();}
});
document.getElementById('prev').onclick=()=>{st.d=(st.d+DESIGNS.length-1)%DESIGNS.length;render()};
document.getElementById('next').onclick=()=>{st.d=(st.d+1)%DESIGNS.length;render()};
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return; if(e.key==='ArrowLeft')document.getElementById('prev').click(); if(e.key==='ArrowRight')document.getElementById('next').click();});
(()=>{const p=document.getElementById('picker'),g=p.querySelector('.grip');let sx,sy,ox,oy;g.onmousedown=e=>{sx=e.clientX;sy=e.clientY;const r=p.getBoundingClientRect();ox=r.left;oy=r.top;
 const mv=e=>{p.style.left=ox+e.clientX-sx+'px';p.style.top=oy+e.clientY-sy+'px';p.style.right='auto';p.style.bottom='auto'};const up=()=>{removeEventListener('mousemove',mv);removeEventListener('mouseup',up)};addEventListener('mousemove',mv);addEventListener('mouseup',up)}})();
render();
</script>
</body>
