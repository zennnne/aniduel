// ---------- R11-12: split an oversized Band into 3 Sub-bands (handoff from the algorithm session) ----------
// Mock Pool: 200 titles, beginner Bands 150/12/12/13/13. Duel estimates = sum of log2(n!) per group, no Tiers.
// Settled R11: offer = bar chart with a danger line; split = paint covers; 3 groups; display = Loved row striped.
const SPB=[150,12,12,13,13];
const SP={state:'offer',paint:{},brush:0,sel:{},last:null,cur:0,pass:0,drag:null,down:false};
const SP_STATES=[['offer','Offer'],['split','Splitting'],['done','Done']];
const SPL=['Best','Middle','Lowest'], MID=1;
const duelsFor=sizes=>Math.round(sizes.reduce((a,n)=>a+lg2f(n),0));
const spGroup=i=>SP.paint[i]??MID;
const spCounts=()=>{ const c=[0,0,0]; T.forEach((_,i)=>c[spGroup(i)]++); return c.map(x=>x*3); }; // mock shows 50 of 150
const spSizes=()=>{ const c=spCounts(); return c[0]+c[2]?c:[34,70,46]; };
const spBase=()=>duelsFor(SPB);
const spAfter=()=>duelsFor([...spSizes(),...SPB.slice(1)]);
const spSave=()=>spBase()-spAfter();
const minsD=d=>Math.round(d*3/60); // ~3 s per Duel
const spCol=k=>`hsl(345 100% ${70+k*10}%)`;
const spPill=(k,txt=SPL[k],fs)=>`<span class="kao" style="background:${spCol(k)}${fs?`;font-size:${fs}px`:''}">${txt}</span>`;
const spGo=()=>{SP.state='split';render()};
const setG=(i,g)=>{ if(g===MID) delete SP.paint[i]; else SP.paint[i]=g; };
const flash=t=>{ S.toast=t; render(); clearTimeout(flash.t); flash.t=setTimeout(()=>{S.toast=null;render(false)},2600); };
const spSkip=()=>flash('Skipped. Loved stays one Band');
const spToast=()=>S.toast?`<div class="toast">${S.toast}</div>`:'';
const spDoneBtn=`<button class="go sm" onclick="spFinish()">Done <span class="kbd">Enter</span></button>`;
const liveSave=()=>spBase()-duelsFor([...spCounts(),...SPB.slice(1)]);
function spFinish(force){ if(!force&&liveSave()<100){SP.warn=true;render();return} SP.warn=false; SP.state='done'; render(); }
function spWarn(){ if(!SP.warn) return ''; const c=spCounts();
  return `<div class="dscrim" onclick="SP.warn=false;render()"><div class="dlg" onclick="event.stopPropagation()"><div class="h2">Middle still has ${c[1]} titles</div>
  <p>That only saves <b>${liveSave()}</b> Duels. Move a few more up to Best or down to Lowest and it saves a lot more: a quarter each way is about −${spBase()-duelsFor([38,74,38,...SPB.slice(1)])}.</p>
  <div class="row" style="justify-content:flex-end;gap:10px;margin-top:6px"><button class="link" onclick="spFinish(true)">Finish anyway</button><button class="go" onclick="SP.warn=false;render()">Keep sorting</button></div></div></div>`; }
const spCountChips=()=>{ const c=spCounts(); const sv=spBase()-duelsFor([...c,...SPB.slice(1)]); return `<div class="row" style="gap:6px">${SPL.map((l,k)=>`${spPill(k,`${l} ${c[k]}`,11)}`).join('')}<span class="livesave ${sv<100?'low':''}">−${sv} Duels</span></div>`; };
const spHead=(title,hint)=>`<div class="row sphead"><div class="col grow" style="gap:2px"><b class="strong" style="font-size:18px">${title}</b><span class="small">${hint}</span></div>${spCountChips()}${spDoneBtn}</div>`;
const spMock=`<div class="small fine">Mock shows 50 of the 150 Loved titles (counts ×3). The real grid is sorted like Rough Sort: most recently completed first.</div>`;
const tcv=(x,extra='')=>`${cv(x)}<span class="tt">${x.t}</span>${extra}`;

function spChart(split){ const H=200;
  const bars=split?[...spSizes().map((s,k)=>({s,c:spCol(k),l:spPill(k,SPL[k],10)})),...SPB.slice(1).map((s,i)=>({s,c:COL[i+1],l:kao(i+1,10)}))]
    :SPB.map((s,b)=>({s,c:COL[b],l:kao(b,10)}));
  return `<div class="spchart"><div class="bars">${bars.map(x=>`<div class="c1"><span class="cnt">${x.s}</span><div class="barv" style="height:${Math.min(x.s,150)/150*H}px;background:${x.c}"></div></div>`).join('')}
    <div class="line" style="bottom:${40/150*H}px"><span>above ~40 titles, Duels pile up fast</span></div></div>
    <div class="labs">${bars.map(x=>`<span>${x.l}</span>`).join('')}</div></div>`; }

// --- Offer (settled) ---
function spOffer(){ const s=duelsFor(SPB)-duelsFor([34,70,46,...SPB.slice(1)]);
  return `<div class="bc"><div class="h1">Your Bands are lopsided</div><div class="sub">Duels only happen inside a Band, and one big Band costs far more Duels than a few small ones.</div>${spChart(false)}
    <div class="spcount"><b class="strong">Split Loved into 3 groups?</b><span class="small">Mark the ones that are your very best and the ones that are only just Loved. Everything you leave alone stays in the middle.</span>
    <div class="spnums"><div><b>${spBase()}</b><span class="small">Duels now</span></div><div class="eq">→</div><div class="good"><b>~${spBase()-s}</b><span class="small">after splitting · −${s} (~${minsD(s)} min)</span></div></div>
    <div class="row"><button class="go" onclick="spGo()">Split Loved <span class="kbd">Enter</span></button><button class="link" onclick="spSkip()">Keep it as it is</button></div></div>${spToast()}</div>`; }

// --- Splitting: 5 ways to paint ---
function spBrushGrid(){ // P1 brush + click or sweep
  return `<div class="sppaint" onpointerup="SP.down=false" onpointerleave="SP.down=false">${spHead('Paint Loved into 3 groups','Pick a brush (1–3), then click covers, or hold and sweep across them. Unpainted = Middle.')}
    <div class="brushes">${SPL.map((l,k)=>`<button class="brush ${SP.brush===k?'on':''}" style="--b:${spCol(k)}" onclick="SP.brush=${k};render()"><span class="kbd">${k+1}</span>${l}${k===MID?' (eraser)':''}</button>`).join('')}</div>
    <div class="pgrid">${T.map((x,i)=>{const g=SP.paint[i]; return `<button class="pc ${g!=null?'on':''}" style="--b:${spCol(spGroup(i))}" onpointerdown="SP.down=true;spBrush(${i})" onpointerenter="if(SP.down)spBrush(${i})">${tcv(x,g!=null?`<span class="pb">${SPL[g]}</span>`:'')}</button>`}).join('')}</div>${spMock}</div>`; }
function spBrush(i){ if(spGroup(i)===SP.brush&&!SP.down) return; setG(i,SP.brush); render(false); }

function spColumns(){ // P2 three columns, drag between them
  return `<div class="sppaint">${spHead('Sort Loved into 3 columns','Everything starts in Middle. Drag a cover to Best or Lowest, or use its ↑ ↓ buttons. Aim for about a quarter in each.')}
    <div class="spcols">${SPL.map((l,k)=>{const ids=T.map((_,i)=>i).filter(i=>spGroup(i)===k);
      return `<div class="spcol ${k===MID?'mid':''}" style="--b:${spCol(k)}" ondragover="event.preventDefault();this.classList.add('over')" ondragleave="this.classList.remove('over')" ondrop="setG(SP.drag,${k});render()">
        <div class="spcolh">${spPill(k)}<span class="small">${ids.length*3}</span></div>
        <div class="pgrid sm">${ids.map(i=>`<div class="pc" draggable="true" ondragstart="SP.drag=${i}">${tcv(T[i])}<span class="arrows">${k>0?`<button onclick="setG(${i},${k-1});render()">↑</button>`:''}${k<2?`<button onclick="setG(${i},${k+1});render()">↓</button>`:''}</span></div>`).join('')||'<div class="small empty">drop covers here</div>'}</div></div>`}).join('')}</div>${spMock}</div>`; }

function spSelect(){ // P3 select many, then assign
  const sel=Object.keys(SP.sel).map(Number), n=sel.length;
  return `<div class="sppaint">${spHead('Select, then file','Click covers to select (Shift+click for a range), then press 1 / 2 / 3 to file them. Like a photo app.')}
    <div class="pgrid">${T.map((x,i)=>{const g=SP.paint[i]; return `<button class="pc ${g!=null?'on':''} ${SP.sel[i]?'sel':''}" style="--b:${spCol(spGroup(i))}" onclick="spSel(${i},event.shiftKey)">${tcv(x,`${g!=null?`<span class="pb">${SPL[g]}</span>`:''}<span class="tick">${SP.sel[i]?'✓':''}</span>`)}</button>`}).join('')}</div>${spMock}
    ${n?`<div class="selbar"><b>${n} selected</b><span class="small">move to</span>${SPL.map((l,k)=>`<button style="--b:${spCol(k)}" onclick="spFile(${k})"><span class="kbd">${k+1}</span>${l}</button>`).join('')}<button class="x" onclick="SP.sel={};render()">${IC.x}</button></div>`:''}</div>`; }
function spSel(i,shift){ if(shift&&SP.last!=null){ const [a,b]=[SP.last,i].sort((x,y)=>x-y); for(let k=a;k<=b;k++) SP.sel[k]=true; } else { if(SP.sel[i]) delete SP.sel[i]; else SP.sel[i]=true; } SP.last=i; render(); }
function spFile(k){ Object.keys(SP.sel).forEach(i=>setG(+i,k)); SP.sel={}; SP.last=null; render(); }

function spCursor(){ // P4 keyboard cursor with a big preview
  const x=T[SP.cur];
  return `<div class="spcur"><div class="sppaint">${spHead('Fly through Loved','Arrows move · 1 Best · 2 Middle · 3 Lowest (then it jumps to the next) · click works too · Shift+←/→ switches design')}
    <div class="pgrid">${T.map((y,i)=>{const g=SP.paint[i]; return `<button class="pc ${g!=null?'on':''} ${i===SP.cur?'focus':''}" style="--b:${spCol(spGroup(i))}" onclick="SP.cur=${i};render()">${cv(y)}${g!=null?`<span class="pb">${SPL[g]}</span>`:''}</button>`}).join('')}</div>${spMock}</div>
    <aside class="spprev">${bg(x)}<div class="in">${cv(x)}<b>${x.t}</b><span class="small">${meta(x)}</span><div class="col" style="gap:6px;width:100%">${SPL.map((l,k)=>`<button class="bandbtn ${spGroup(SP.cur)===k?'cur2':''}" onclick="spCurSet(${k})"><span class="kbd">${k+1}</span>${spPill(k)}</button>`).join('')}</div></div></aside></div>`; }
function spCurSet(k){ setG(SP.cur,k); SP.cur=Math.min(T.length-1,SP.cur+1); render(); }
function spCurMove(dx,dy){ const cols=Math.max(1,Math.round((document.querySelector('.spcur .pgrid')?.clientWidth||600)/86)); SP.cur=Math.max(0,Math.min(T.length-1,SP.cur+dx+dy*cols)); render(); }

function spPasses(){ // P5 two passes, one click each, no brushes
  const p=SP.pass, ids=T.map((_,i)=>i).filter(i=>p===0||SP.paint[i]!==0);
  return `<div class="sppaint"><div class="spsteps"><span class="${p===0?'on':'done'}">① Your very best</span><span class="${p===1?'on':''}">② Only just Loved</span><span>③ The rest stay Middle</span></div>
    <div class="row sphead"><div class="col grow" style="gap:2px"><b class="strong" style="font-size:20px">${p===0?'Tap the ones that are your <u>very best</u>':'Now tap the ones that are only <u>just</u> Loved'}</b><span class="small">${p===0?'Usually a small handful. Tap again to unpick.':'The ones you already picked as Best are hidden.'}</span></div>${spCountChips()}
    ${p===0?`<button class="go sm" onclick="SP.pass=1;render()">Next <span class="kbd">Enter</span></button>`:`<button class="link" onclick="SP.pass=0;render()">Back</button>${spDoneBtn}`}</div>
    <div class="pgrid">${ids.map(i=>{const on=SP.paint[i]===(p?2:0); return `<button class="pc ${on?'on':''}" style="--b:${spCol(p?2:0)}" onclick="setG(${i},${on?MID:(p?2:0)});render()">${tcv(T[i],on?`<span class="pb">${p?'Lowest':'Best'}</span>`:'')}</button>`}).join('')}</div>${spMock}</div>`; }

function spSplit(){ return spColumns()+spWarn()+spToast(); }

// --- Done (settled: striped) ---
function spDone(){ const s=spSave();
  return `<div class="bc"><div class="h1">Loved is split ${kao(0,18)}</div><div class="sub">About <b class="strong">${spAfter()}</b> Duels to go instead of ${spBase()}: ${s} fewer.</div>${spChart(true)}
    <button class="go" onclick="pickBand(0)">Start Duels in Loved › Best <span class="kbd">Enter</span></button>
    <p class="small" style="margin-top:10px">Loved stays one row in the sidebar; its bar is striped by group. Duels go Best → Middle → Lowest.</p></div>`; }
function splitScreen(){ return SP.state==='offer'?spOffer():SP.state==='split'?spSplit():spDone(); }

// sidebar rows while on the Split screen
function spSide(){
  const row=(pill,bar,c)=>`<div class="bandrow">${pill}${bar}<span>${c}</span></div>`, empty='<div class="bar"><i style="width:0"></i></div>';
  const others=[1,2,3,4].map(b=>row(kao(b,10),empty,`0/${SPB[b]}`)).join('');
  const segs=S.screen==='Split'&&SP.state==='offer'?'<div class="bar over"><i style="width:0"></i></div>':`<div class="bar segs">${spSizes().map((c,k)=>`<i style="flex:${c};background:${spCol(k)}"></i>`).join('')}</div>`;
  return row(kao(0,10),segs,'0/150')+others;
}

// ---------- R13: moving a title between Sub-bands during Duels (title is in Loved › Middle) ----------
const MV={exp:false}, CURSUB=1;
function mvAuto(){ MV.exp=false; if(S.screen==='Move'&&vid()!=='corner'&&E.cur!=null) S.moving=pair()[0]; }
function mvSub(id,k){ if(k===CURSUB) return; takeOut(id); S.moving=null; MV.exp=false; S.toast=`Moved <b>${nm(id)}</b> to ${kao(0,11)} › ${spPill(k,SPL[k],11)}`; render(); }
const subCorner=x=>S.screen==='Move'&&vid()==='corner'?`<button class="ibtn tip" data-tip="Higher in Loved (Best)" onclick="mvSub(${x.id},0)">↑</button><button class="ibtn tip" data-tip="Lower in Loved (Lowest)" onclick="mvSub(${x.id},2)">↓</button>`:'';
function spSheet(){ if(S.moving==null) return ''; const x=T[S.moving], d=vid();
  if(d==='corner') return sheet();
  const hd=`<div class="hd">${cv(x)}<div class="grow">Move “${x.t}”<div class="small" style="font-weight:400">now in ${kao(0,10)} › ${spPill(1,'Middle',10)}</div></div><button onclick="openMove(${x.id})">${IC.x}</button></div>`;
  const wrap=inner=>`<div class="mv-scrim" onclick="openMove(${x.id})"><div class="mv-sheet" ${stop}>${hd}${inner}</div></div>`;
  const band=(i,key=i+1)=>`<button class="bandbtn" onclick="event.stopPropagation();moveTo(${x.id},${i})">${kao(i)}<span class="lab">${LABELS[i]}</span><span class="kbd">${key}</span></button>`;
  const sub=(k,key,pre='')=>`<button class="bandbtn ${k===CURSUB?'curband':''}" onclick="event.stopPropagation();mvSub(${x.id},${k})">${pre}${spPill(k)}<span class="lab">${k===CURSUB?'current':''}</span><span class="kbd">${key}</span></button>`;
  if(d==='two') return wrap(MV.exp?`<div class="grid g4"><button class="bandbtn" onclick="event.stopPropagation();MV.exp=false;render()"><span class="lab">← all Bands</span><span class="kbd">Esc</span></button>${[0,1,2].map(k=>sub(k,k+1)).join('')}</div>`
    :`<div class="grid"><button class="bandbtn" onclick="event.stopPropagation();MV.exp=true;render()">${kao(0)}<span class="lab">Loved ›</span><span class="kbd">1</span></button>${[1,2,3,4].map(i=>band(i)).join('')}</div>`);
  if(d==='flat7') return wrap(`<div class="grid g7">${[0,1,2].map(k=>sub(k,k+1,kao(0,10))).join('')}${[1,2,3,4].map(i=>band(i,i+3)).join('')}</div>`);
  if(d==='stripe') return wrap(`<div class="grid g5s"><div class="bandbtn stripe">${kao(0)}<div class="stripes">${[0,1,2].map(k=>`<button style="background:${spCol(k)}" class="${k===CURSUB?'cur':''}" onclick="event.stopPropagation();mvSub(${x.id},${k})">${SPL[k]}<span class="kbd">${'QWE'[k]}</span></button>`).join('')}</div></div>${[1,2,3,4].map(i=>band(i)).join('')}</div>`);
  if(d==='nudge') return wrap(`<div class="nudge">${sub(0,'↑','<span class="lab">one step up ›</span>')}${sub(2,'↓','<span class="lab">one step down ›</span>')}</div>
    ${MV.exp?`<div class="grid g4">${[1,2,3,4].map(i=>band(i)).join('')}</div>`:`<button class="link" onclick="event.stopPropagation();MV.exp=true;render()">Another Band… <span class="kbd">B</span></button>`}`);
}
function mvKey(e){ const d=vid(), k=e.key.toLowerCase(), n=/^[1-7]$/.test(k)?+k:0, id=S.moving;
  if(d==='corner') return false;
  const go=f=>{e.preventDefault();f();return true};
  if(d==='two'){ if(MV.exp){ if(n>=1&&n<=3) return go(()=>mvSub(id,n-1)); if(k==='escape'||k==='backspace') return go(()=>{MV.exp=false;render()}); return false; }
    if(n===1) return go(()=>{MV.exp=true;render()}); if(n>=2&&n<=5) return go(()=>moveTo(id,n-1)); return false; }
  if(d==='flat7'){ if(n>=1&&n<=3) return go(()=>mvSub(id,n-1)); if(n>=4&&n<=7) return go(()=>moveTo(id,n-3)); return false; }
  if(d==='stripe'){ const q='qwe'.indexOf(k); if(q>=0) return go(()=>mvSub(id,q)); if(n>=2&&n<=5) return go(()=>moveTo(id,n-1)); return false; }
  if(d==='nudge'){ if(k==='arrowup') return go(()=>mvSub(id,0)); if(k==='arrowdown') return go(()=>mvSub(id,2)); if(k==='b') return go(()=>{MV.exp=true;render()}); if(MV.exp&&n>=2&&n<=5) return go(()=>moveTo(id,n-1)); return false; }
  return false; }
let timer=null;
function runCountdown(){ clearInterval(timer); S.count=5; S.countdownP=0; if(S.screen!=='Band choice'||vid()!=='party') return;
  timer=setInterval(()=>{ S.count--; S.countdownP=(5-S.count)*20; if(S.count<=0){clearInterval(timer); S.count='→'; } render(false); },1000); }

function render(restart=true){
  document.body.classList.toggle('mobile',S.mobile); document.body.classList.toggle('dark',S.dark);
  const app=document.getElementById('app');
  const sidePick=S.screen==='Band choice'&&vid()==='side';
  const startNoSide=S.screen==='Start';
  app.className=`${(S.side||S.mobile)&&!startNoSide?'':'noside'} ${sidePick?'bandpick':''} ${startNoSide&&S.mobile?'nosidem':''}`;
  const isDuel=S.screen==='Duel';
  const done=E.sorted.flat().length, tot=14, pct=done/tot*100;
  const rows=LABELS.map((b,i)=>{ const p=isDuel?(i==0?pct:0):BC[i].done/BC[i].n*100, c=isDuel?(i==0?`${done}/${tot}`:`0/${BC[i].n}`):`${BC[i].done}/${BC[i].n}`;
    return `<${sidePick?`button onclick="pickBand(${i})"`:'div'} class="bandrow ${isDuel&&i==0?'cur':''}">${kao(i,10)}<div class="bar"><i style="width:${p}%"></i></div><span>${c}</span></${sidePick?'button':'div'}>`}).join('');
  const sidebar=`<aside class="side"><div class="row"><div class="logo grow">Ani<b>Duel!</b></div><button class="hide-m sbtn" title="Theme" onclick="S.dark=!S.dark;render()">${S.dark?IC.sun:IC.moon}</button><button class="hide-m sbtn" title="Hide sidebar ([)" onclick="setSide(0)">${IC.hide}</button></div>
    <div class="small hide-m">zen · Anime · ${S.screen==='Split'||S.screen==='Move'?200:142} titles</div>
    <div class="col hide-m" style="gap:4px">${S.screen==='Split'||S.screen==='Move'?spSide():rows}</div>
    ${S.screen==='Split'?'':`<div class="small hide-m row">${kao(0,10)} Ranking so far</div>`}
    <div class="rank hide-m" ${S.screen==='Split'?'style="display:none"':''}>${E.sorted.map((tier,i)=>{const inb=E.cur!=null&&i>=E.lo&&i<E.hi,pv=E.cur!=null&&i===pivotIdx();return `<div class="${pv?'piv':inb?'inb':'out'}">${i+1}. ${tier.map(nm).join(' = ')}</div>`}).join('')}</div>
    ${S.screen==='Menu'?`<div class="hide-m">${menuSideBottom(vid())}</div>`:''}
    ${S.mobile?`<div class="grow"></div>${kao(0,9)}<span class="small">${done}/${tot}</span>${IC.menu}`:''}</aside>`;
  const sideBtn=!S.side&&!S.mobile&&S.screen!=='Start'?`<div class="float-side"><button class="ibtn" onclick="setSide(1)">${IC.menu}</button></div>`:'';
  const main={'Move':duel,'Split':splitScreen,'Menu':duel,'Import':importScreen,'Preview':preview,'Start':start,'Duel':duel,'Band choice':bandChoice,'Rough Sort':rough}[S.screen]();
  app.innerHTML=sidebar+`<main class="main">${sideBtn}${main}${S.screen==='Menu'?menuOverlay(vid()):''}</main>${dialog()}`;
  const V=VARS[S.screen], cur=V[S.v[S.screen]];
  pname.textContent=cur.name; psub.textContent=cur.sub; pidx.textContent=`${S.v[S.screen]+1}/${V.length}`; phelp.textContent=HELP[S.screen];
  pscreen.innerHTML=SCREENS.map(v=>`<button class="${S.screen===v?'on':''}" onclick="go('${v}')">${v}</button>`).join('');
  pstate.innerHTML=S.screen==='Split'?SP_STATES.map(([k,l])=>`<button class="${SP.state===k?'on':''}" onclick="SP.state='${k}';render()">${l}</button>`).join(''):S.screen==='Import'?IM_STATES.map(([k,l])=>`<button class="${IM.state===k?'on':''}" onclick="imSet('${k}')">${l}</button>`).join(''):S.screen==='Preview'?Object.keys(FMT).map(k=>`<button class="${PV.fmt===k?'on':''}" onclick="PV.fmt='${k}';PV.filter=null;render()">${FMT[k].name}</button>`).join(''):S.screen==='Start'?['Logged out','Pool setup'].map((v,i)=>`<button class="${+S.logged===i?'on':''}" onclick="S.logged=${!!i};S.step=${i?2:1};render()">${v}</button>`).join(''):'<span style="color:#777;font-size:11px">—</span>';
  pview.innerHTML=['Desktop','Mobile'].map((v,i)=>`<button class="${+S.mobile===i?'on':''}" onclick="S.mobile=${!!i};render()">${v}</button>`).join('');
  if(restart) runCountdown();
}
function go(v){ S.screen=v; S.moving=null; S.toast=null; mvAuto(); render(); }
const setSide=i=>{S.side=!!i;render()};
function cycle(n){ MN.open=false; MN.dlg=null; const V=VARS[S.screen]; S.v[S.screen]=(S.v[S.screen]+n+V.length)%V.length; S.moving=null; mvAuto(); render() }
sys.addEventListener('change',e=>{S.dark=e.matches;render()});
document.addEventListener('click',e=>{ if(S.moving!=null&&!e.target.closest('.mv-pop,.mv-over,.mv-sheet,.mv-inline,.mv-radial,.ibtn')){S.moving=null;render()} });

let fMode=false;
addEventListener('keydown',e=>{
  if(S.screen==='Menu'&&(e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'&&vid()==='palette'){e.preventDefault();MN.open=true;MN.q='';render();setTimeout(()=>document.getElementById('palq')?.focus());return}
  if(e.key==='Escape'&&(MN.open||MN.dlg)){MN.open=false;MN.dlg=null;render();return}
  if(e.target.tagName==='INPUT'){ if(e.key==='Enter'&&MN.open){const q=MN.q.toLowerCase(), it=ITEMS.find(i=>!q||i.t.toLowerCase().includes(q)||i.d.toLowerCase().includes(q)); if(it) mnDo(it.k);} return; }
  if(e.key==='[')setSide(+!S.side);
  if(S.screen==='Duel'||S.screen==='Move'){
    if(e.key==='Escape'&&S.screen==='Move'&&MV.exp){MV.exp=false;render();return}
    if(e.key==='Escape'){S.moving=null;S.mPending=false;render();return}
    if(S.screen==='Move'&&S.moving!=null&&mvKey(e)) return;
    if(S.moving!=null&&'12345'.includes(e.key)&&e.key.length===1){moveTo(S.moving,+e.key-1);return}
    if(e.key==='ArrowLeft'||e.key==='ArrowRight'){ const dir=e.key==='ArrowLeft'?-1:1; e.preventDefault();
      if(e.shiftKey){cycle(dir);return} if(E.cur==null)return; const [l,r]=pair(), id=dir<0?l:r;
      if(S.mPending){S.mPending=false;openMove(id);return}
      if(fMode){fMode=false;forget(id)} else answer(id); return; }
    if(e.key==='m'||e.key==='M'){S.mPending=true;render();return}
    if(e.key==='ArrowDown'){answer('tie');e.preventDefault()} if(e.key==='Backspace')undo(); if(e.key==='f'||e.key==='F')fMode=true;
  } else if(S.screen==='Split'){
    const cur=SP.state==='split'&&vid()==='cursor';
    if((e.key==='ArrowLeft'||e.key==='ArrowRight')&&(!cur||e.shiftKey)){cycle(e.key==='ArrowLeft'?-1:1);e.preventDefault();return}
    if(e.key==='Enter'){ if(SP.state==='offer') spGo(); else if(SP.state==='done') pickBand(0); else if(!SP.warn) spFinish(); return; }
    if(SP.state!=='split') return;
    const d=vid(), k=/^[1-3]$/.test(e.key)?+e.key-1:-1;
    if(d==='brush'&&k>=0){SP.brush=k;render()}
    if(d==='select'&&k>=0&&Object.keys(SP.sel).length) spFile(k);
    if(d==='cursor'){ if(k>=0) spCurSet(k);
      const mv={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key]; if(mv){e.preventDefault();spCurMove(...mv)} }
  } else if(S.screen==='Rough Sort'){
    if('12345'.includes(e.key)&&e.key.length===1)rsPick(+e.key-1); if(e.key==='0')rsPick(-1); if(e.key==='Backspace')rsUndo();
  } else {
    if(e.target.tagName==='SELECT') return;
    if(e.key==='ArrowLeft'||e.key==='ArrowRight'){cycle(e.key==='ArrowLeft'?-1:1);e.preventDefault()}
    if(e.key==='Enter'&&S.screen==='Band choice')pickBand(1);
  }
});
(()=>{const p=picker,g=p.querySelector('.grip');let sx,sy,ox,oy;
g.onpointerdown=e=>{const r=p.getBoundingClientRect();sx=e.clientX;sy=e.clientY;ox=r.left;oy=r.top;g.setPointerCapture(e.pointerId);
  g.onpointermove=m=>{p.style.left=ox+m.clientX-sx+'px';p.style.top=oy+m.clientY-sy+'px';p.style.right='auto';p.style.bottom='auto'}};
g.onpointerup=()=>g.onpointermove=null;})();
render();

fetch('https://graphql.anilist.co',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:
 `{Page(perPage:50){media(type:ANIME,sort:POPULARITY_DESC){id title{romaji english} startDate{year} format episodes coverImage{extraLarge color} bannerImage}}}`})})
 .then(r=>r.json()).then(j=>{ j.data.Page.media.forEach((m,i)=>Object.assign(T[i],{aid:m.id,t:m.title.english||m.title.romaji,y:m.startDate.year,f:m.format,eps:m.episodes,
   c:m.coverImage.color||T[i].c,cover:m.coverImage.extraLarge,banner:m.bannerImage})); S.toast=null; render(false); }).catch(()=>{});
</script>
